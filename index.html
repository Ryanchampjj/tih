<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thai International Hospital Phangan — ศูนย์รวมระบบงาน</title>
<meta name="theme-color" content="#2B4CA0">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ระบบงาน TIH">
<link rel="apple-touch-icon" href="icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<!-- ต่อสายรอไว้ล่วงหน้า ลดเวลารอตอนกดเข้าระบบงาน -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="dns-prefetch" href="https://script.google.com">
<link rel="preconnect" href="https://attendance-live-thaiinter.vercel.app" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2B4CA0;--red:#E8252B;--bg:#AACCD6;--card:#FFFFFF;
    --text:#1F2A44;--muted:#6B7385;--border:#E4E8F2;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Sarabun',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 16px 48px;}
  .wrap{width:100%;max-width:880px;}
  header{text-align:center;margin-bottom:32px;}
  .logo{width:100%;max-width:560px;height:auto;margin:0 auto 18px;display:block;}
  .sub{font-size:16px;color:var(--muted);font-weight:500;}
  .divider{width:64px;height:4px;border-radius:2px;background:var(--red);margin:14px auto 0;}
  /* กริดไร้ขอบสไตล์ Chobani — ไทล์จัตุรัสชนกันสนิท 2 คอลัมน์ */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border-radius:18px;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.28);}
  .tile{position:relative;display:block;aspect-ratio:1/1;overflow:hidden;text-decoration:none;-webkit-tap-highlight-color:transparent;background:#e9edf3;}
  .tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .28s ease;}
  .tile:hover img{transform:scale(1.045);}
  .tile:active img{transform:scale(1.0);}
  .tile:focus-visible{outline:3px solid #fff;outline-offset:-4px;}
  /* การ์ด "ยังไม่เปิดใช้" */
  .tile.soon{cursor:default;}
  .tile.soon img{filter:brightness(.86) saturate(.9);}
  .tile.soon:hover img{transform:none;}
  .soonbadge{position:absolute;top:12px;right:12px;background:rgba(20,25,45,.74);color:#fff;font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:20px;letter-spacing:.2px;}
  /* การ์ดตกแต่ง กดไม่ได้ */
  .tile.deco{cursor:default;}
  .tile.deco:hover img{transform:none;}
  #toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(18px);background:rgba(20,25,45,.95);color:#fff;padding:13px 22px;border-radius:12px;font-size:15px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:88vw;text-align:center;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  footer{margin-top:40px;font-size:13px;color:var(--muted);text-align:center;}
  .scanbtn{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#2B4CA0,#3A63C8);color:#fff;border-radius:16px;padding:20px 22px;text-decoration:none;margin-bottom:18px;box-shadow:0 12px 22px rgba(0,0,0,.30);transition:transform .15s ease,box-shadow .15s ease;}
  .scanbtn:hover{transform:translateY(-3px);box-shadow:0 18px 34px rgba(0,0,0,.40);}
  .scanbtn:active{transform:scale(.99);}
  .scanbtn .sico{width:54px;height:54px;border-radius:14px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .scanbtn .sico svg{width:30px;height:30px;stroke:#fff;}
  .scanbtn .t{font-size:20px;font-weight:600;line-height:1.15;}
  .scanbtn .d{font-size:13px;opacity:.92;margin-top:3px;}
  .scanbtn .ar{margin-left:auto;font-size:24px;line-height:1;}
  /* ---- แถว "การแจ้งเตือน" ใต้ปุ่มสแกน (พี่เลือกแบบ 1 · 04/10/2569) — กดแล้วเปิดหน้าการแจ้งเตือนเต็มจอ ---- */
  .ntrow{display:flex;align-items:center;gap:16px;width:100%;background:var(--card);border:0;border-radius:16px;padding:18px 22px;margin-bottom:18px;box-shadow:0 12px 22px rgba(0,0,0,.18);cursor:pointer;font-family:inherit;text-align:left;color:var(--text);-webkit-tap-highlight-color:transparent;transition:transform .15s ease;}
  .ntrow:active{transform:scale(.99);}
  .ntrow .nico{width:54px;height:54px;border-radius:14px;background:#E1EFFB;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .ntrow .nico svg{width:28px;height:28px;stroke:#2A78B8;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .ntrow .t{font-size:20px;font-weight:600;line-height:1.15;}
  .ntrow .d{font-size:13px;color:var(--muted);margin-top:3px;}
  .ntrow .n{margin-left:auto;min-width:30px;height:30px;padding:0 9px;border-radius:999px;background:#DC2626;color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .ntrow .n[hidden]{display:none;}
  .ntrow .ar{font-size:24px;line-height:1;color:var(--muted);margin-left:6px;}
  .ntrow .n[hidden]+.ar{margin-left:auto;}
  /* หน้าการแจ้งเตือนเต็มจอ — กรอบ notify.html ของแอปสแกน (โค้ดชุดเดียวกับปุ่มกระดิ่งในแอปสแกน/พอร์ทัล tihkpn) */
  .ntview{position:fixed;inset:0;z-index:50;background:#EEF4FA;display:flex;flex-direction:column;}
  .ntbar{flex:0 0 auto;background:var(--blue);color:#fff;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 9px) 12px 9px;}
  .ntbar button{font-family:inherit;font-size:15px;font-weight:600;color:#fff;background:rgba(255,255,255,.16);border:0;border-radius:9px;padding:8px 13px;cursor:pointer;white-space:nowrap;}
  .ntbar .ttl{flex:1;font-size:16px;font-weight:600;}
  #notifyFrame{flex:1 1 auto;width:100%;border:0;background:#fff;}
  body.ntopen,body.rdopen{overflow:hidden;}
  /* ---- วิทยุแจ้งเหตุฉุกเฉิน (24/10/2569) — กดค้างพูด ปล่อย = ส่งให้ทุกคนใน รพ. · สีแดงทึบ ไม่ไล่เฉด ----
     จังหวะขยับ (motion-design · แบบ Corporate/เร่งด่วน): กด 120ms (0.2,0,0,1) · แถบแจ้งเหตุเข้า 250ms (0.05,0.7,0.1,1) ออก 180ms (0.3,0,1,1)
     ระหว่างอัด กรอบไอคอนหายใจ 1.2 วิ sine ease-in-out (บอกว่าไมค์เปิดอยู่) · ผู้ใช้ตั้งลดการเคลื่อนไหว = ไม่ขยับ */
  .rdrow{display:flex;gap:10px;margin-bottom:18px;}
  .rdrow.rdbottom{margin:18px 0 0;}   /* ล่างสุดของหน้า ใต้การ์ดระบบงาน (24/10/2569) */
  .rdptt{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:16px;background:#B91C1C;color:#fff;border:0;border-radius:16px;padding:18px 22px;box-shadow:0 12px 22px rgba(0,0,0,.22);font-family:inherit;text-align:left;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;transition:transform .12s cubic-bezier(.2,0,0,1),background-color .12s cubic-bezier(.2,0,0,1);}
  .rdptt:focus-visible{outline:3px solid #1F2A44;outline-offset:2px;}
  .rdptt .rico{width:54px;height:54px;border-radius:14px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .rdptt .rico svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .rdptt .rtx{min-width:0;}
  .rdptt .t{display:block;font-size:20px;font-weight:700;line-height:1.2;}
  .rdptt .d{display:block;font-size:13px;margin-top:3px;line-height:1.35;}
  .rdptt .tm{margin-left:auto;flex-shrink:0;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;}
  .rdptt .tm small{font-size:13px;font-weight:600;opacity:.85;}
  .rdptt .tm.warn{color:#FFE08A;}
  .rdptt.rec{background:#7F1D1D;transform:scale(.985);}
  .rdptt.rec .rico{animation:rdBreath 1.2s ease-in-out infinite;}
  .rdptt.out{background:#4B5563;transform:scale(.985);}
  .rdptt.busy{background:#7F1D1D;cursor:default;}
  @keyframes rdBreath{0%,100%{background:rgba(255,255,255,.18);}50%{background:rgba(255,255,255,.42);}}
  .rdlog{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:84px;background:var(--card);color:#B91C1C;border:2px solid #B91C1C;border-radius:16px;padding:10px 12px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 12px 22px rgba(0,0,0,.14);-webkit-tap-highlight-color:transparent;}
  .rdlog svg{width:26px;height:26px;stroke:#B91C1C;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .rdlog:active{transform:scale(.98);}
  /* แถบชวนเปิดรับแจ้งเหตุ — ฝังในหน้า (ไม่ใช่ป็อปอัป) ค้างจนกว่าเปิดสำเร็จ */
  .rdpush{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:#FFF6E0;border:1px solid #E9B949;color:#3A2A00;border-radius:14px;padding:13px 16px;margin:-6px 0 18px;}
  .rdpush .rpx{flex:1 1 260px;min-width:0;}
  .rdpush .t{font-size:15.5px;font-weight:700;line-height:1.35;}
  .rdpush .d{font-size:13.5px;line-height:1.55;margin-top:2px;}
  .rdpush .rpbtn{flex:0 0 auto;border:0;border-radius:11px;background:#B91C1C;color:#fff;font-family:inherit;font-size:15px;font-weight:700;padding:12px 18px;cursor:pointer;}
  .rdpush .rpbtn:disabled{opacity:.6;cursor:default;}
  .rdpush .rpslot{flex:1 1 100%;}
  .rdpush .rpslot:empty{display:none;}
  .rdpush #installBar{margin:0!important;box-shadow:none!important;}
  /* แถบแจ้งเหตุบนสุดของจอ (ตอนมีคนพูดเข้ามา) — แถบสถานะ ไม่บังทั้งจอ */
  .rdalert{position:fixed;left:0;right:0;top:0;z-index:80;display:flex;align-items:center;gap:12px;background:#B91C1C;color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;box-shadow:0 6px 18px rgba(0,0,0,.35);transform:translateY(-110%);visibility:hidden;transition:transform .18s cubic-bezier(.3,0,1,1),visibility 0s linear .18s;}
  .rdalert.on{transform:none;visibility:visible;transition:transform .25s cubic-bezier(.05,.7,.1,1),visibility 0s;}
  .rdalert .aico svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;}
  .rdalert .atx{flex:1;min-width:0;}
  .rdalert .atx b{display:block;font-size:16px;line-height:1.3;}
  .rdalert .atx span{display:block;font-size:13px;opacity:.95;}
  /* แถบแจ้งเหตุโผล่ = ดันหน้าและกรอบเต็มจอลงเท่าความสูงแถบ (ไม่บังปุ่ม "กลับ"/ชื่อผู้ใช้) */
  body.rdal .wrap{margin-top:var(--rdal,0px);}
  body.rdal .ntview{top:var(--rdal,0px);}
  body.rdal .ntview .ntbar{padding-top:9px;}
  .rdptt .nw{display:inline-block;}
  .rdalert button{flex:0 0 auto;font-family:inherit;font-size:15px;font-weight:700;border-radius:10px;padding:10px 14px;cursor:pointer;border:0;}
  .rdalert .ap{background:#fff;color:#B91C1C;}
  .rdalert .ac{background:rgba(255,255,255,.18);color:#fff;}
  /* หน้าย้อนหลัง #radio — ใช้กรอบเต็มจอชุดเดียวกับ #notify · แถวเรียงเต็มความกว้าง จอกว้างได้หลายคอลัมน์ */
  .ntbar .ttl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rdlist{flex:1 1 auto;overflow-y:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr));gap:8px;align-content:start;}
  .rditem{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #D3DCE8;border-radius:12px;padding:10px 12px;min-width:0;}
  .rditem.playing{background:#FDECEC;border-color:#B91C1C;}
  .rditem .rdplay{flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:0;background:#B91C1C;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .rditem .rdplay svg{width:22px;height:22px;fill:#fff;}
  .rditem .rdplay:disabled{background:#9AA3B2;cursor:default;}
  .rditem .rw{flex:0 0 auto;text-align:center;min-width:62px;}
  .rditem .rw b{display:block;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.1;}
  .rditem .rw small{display:block;font-size:12px;color:var(--muted);}
  .rditem .rn{flex:1;min-width:0;}
  .rditem .rn b{display:block;font-size:15px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rditem .rn small{display:block;font-size:13px;color:#4A5468;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rditem .rl{flex:0 0 auto;font-size:14px;font-weight:600;color:#4A5468;font-variant-numeric:tabular-nums;}
  .rdempty{grid-column:1/-1;text-align:center;color:#3B475C;font-size:15px;line-height:1.7;padding:40px 16px;}
  @media (max-width:600px){
    .rdrow{gap:8px;}
    .rdptt{padding:14px 12px;gap:10px;}
    .rdptt .rico{width:40px;height:40px;border-radius:12px;}
    .rdptt .rico svg{width:24px;height:24px;}
    .rdptt .t{font-size:17.5px;}
    .rdptt .d{font-size:12.5px;}
    .rdptt .tm{font-size:22px;}
    .rdptt .tm small{font-size:11.5px;}
    .rdlog{min-width:62px;padding:8px 6px;font-size:12.5px;}
    .rdlog svg{width:22px;height:22px;}
  }
  @media (prefers-reduced-motion:reduce){
    .rdptt,.rdalert,.rdalert.on{transition:none;}
    .rdptt.rec .rico{animation:none;background:rgba(255,255,255,.42);}
  }
  /* ---- login gate ---- */
  .card{background:var(--card);border-radius:16px;box-shadow:0 12px 26px rgba(0,0,0,.18);padding:24px 20px;margin-bottom:18px;}
  .card h2{font-size:20px;font-weight:700;color:var(--blue);margin-bottom:4px;}
  .card .csub{font-size:13.5px;color:var(--muted);margin-bottom:18px;line-height:1.55;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13.5px;font-weight:600;color:var(--text);margin-bottom:6px;}
  .field select,.field input{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:11px;font-size:16px;font-family:inherit;color:var(--text);background:#fff;}
  .field select:focus,.field input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(43,76,160,.14);}
  .btn-primary{width:100%;padding:15px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:17px;font-weight:700;font-family:inherit;cursor:pointer;transition:background .15s,transform .1s;}
  .btn-primary:hover{background:#24408a;}
  .btn-primary:active{transform:scale(.99);}
  .btn-primary:disabled{opacity:.6;cursor:default;}
  .err{color:var(--red);font-size:13.5px;font-weight:600;margin-top:12px;min-height:1em;text-align:center;display:none;}
  .err.show{display:block;}
  .userbar{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:13px 17px;margin-bottom:16px;box-shadow:0 8px 18px rgba(0,0,0,.12);}
  .userbar .who{font-size:15px;font-weight:600;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .userbar .who small{display:block;font-size:12px;color:var(--muted);font-weight:500;}
  .logoutbtn{flex-shrink:0;background:#fff;border:1.5px solid var(--border);color:var(--blue);font-size:13.5px;font-weight:600;font-family:inherit;padding:10px 16px;border-radius:10px;cursor:pointer;}
  .logoutbtn:hover{border-color:var(--blue);}
  .hidden{display:none!important;}
  @media (max-width:600px){body{padding:22px 12px 34px;}.grid{border-radius:14px;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="logo.png" alt="Thai International Hospital Phangan">
    <div class="divider"></div>
  </header>

  <!-- หน้า 1: เข้าสู่ระบบ (โชว์เมื่อยังไม่ได้ล็อกอิน) — พี่สั่ง 04/10/2569: ล็อกอินครั้งเดียวที่นี่ แล้วสแกนหน้า/ทุกเมนูไม่ต้องล็อกอินซ้ำ -->
  <div class="card hidden" id="loginCard">
    <h2>เข้าสู่ระบบ</h2>
    <div class="csub">เลือกชื่อของคุณ แล้วใส่ PIN (ตัวเดียวกับที่ใช้ในแอปสแกนหน้าเข้างาน)</div>
    <div class="field">
      <label for="lgDept">แผนก</label>
      <select id="lgDept"><option value="">— เลือกแผนก —</option></select>
    </div>
    <div class="field">
      <label for="lgName">ชื่อ</label>
      <select id="lgName"><option value="">— เลือกแผนกก่อน —</option></select>
    </div>
    <div class="field">
      <label for="lgPin">PIN</label>
      <input id="lgPin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="PIN 4–6 หลัก">
    </div>
    <button class="btn-primary" id="lgBtn">เข้าสู่ระบบ</button>
    <div class="err" id="lgErr"></div>
  </div>

  <!-- หน้า 2: หน้าหลัก (โชว์เมื่อล็อกอินแล้ว) — ชื่อ/ออกจากระบบ → สแกนหน้า → การแจ้งเตือน → เมนูระบบงาน -->
  <div class="hidden" id="appMenu">
    <div class="userbar">
      <div class="who" id="lgWho"></div>
      <button class="logoutbtn" id="lgOut">ออกจากระบบ</button>
    </div>

    <!-- สแกนหน้า: ย้ายมาอยู่หลังล็อกอิน แนบตั๋วให้แอปสแกน (?tk=) → เลือกชื่อ/ใส่ PIN ให้เองไม่ต้องทำซ้ำ (04/10/2569) -->
    <a class="scanbtn" href="https://attendance-live-thaiinter.vercel.app/">
      <span class="sico"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2"/><path d="M16 4h2a2 2 0 0 1 2 2v2"/><path d="M20 16v2a2 2 0 0 1-2 2h-2"/><path d="M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 10.5v1"/><path d="M15 10.5v1"/><path d="M9 14.5c1 1 5 1 6 0"/></svg></span>
      <span><span class="t">สแกนหน้า เข้า/ออกงาน</span><span class="d">ลงเวลาทำงานประจำวัน</span></span>
      <span class="ar">&#8594;</span>
    </a>

    <!-- การแจ้งเตือน: ใบลา/ฟอร์ม · ความเสี่ยง · เอกสาร · ประกาศ — หน้าเดียวกับกระดิ่งในแอปสแกน ตัวเลขแดง = งานที่รอ/ยังไม่ได้อ่าน -->

<script>
  /* toast + การ์ดที่ยังไม่เปิดใช้ */
  function tihToast(t){var el=document.getElementById('toast');if(!el)return;el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('show');},2400);}
  function notReady(){tihToast('ระบบแจ้งชื่นชมยังไม่เปิดใช้งาน — เปิดเร็ว ๆ นี้');return false;}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
</script>

<script>
/* ===================== ล็อกอินพอร์ทัล (SSO) =====================
   - ล็อกอินทีเดียว → เก็บ "ตั๋ว" (token) ไว้ในเครื่อง (localStorage) จำจนกว่าจะกด "ออกจากระบบ"
   - เข้าแอปในเมนู (รวมสแกนหน้า ตั้งแต่ 04/10/2569) = แนบตั๋วไปให้แอปรู้ว่าใคร (?tk=...)
   - ต่ออายุตั๋วอัตโนมัติทุกครั้งที่เปิด/กลับมาดู (sliding) → ใช้งานอยู่ไม่มีวันหลุด · ตาข่ายนิรภัยอยู่ที่เซิร์ฟเวอร์ (SSO_TTL_SECONDS)
   - ตัวจริงกันปลอมอยู่ที่เซิร์ฟเวอร์แต่ละแอป (ตรวจตั๋วทุกครั้ง) — หน้านี้แค่ประตูให้สะดวก */
(function(){
  var AUTH='https://attendance-live-thaiinter.vercel.app';
  var TK='tih_sso';
  /* การ์ดที่ต้องล็อกอินก่อน → ชื่อระบบ (คีย์เดียวกับ links.json) · สแกนหน้าอยู่หลังล็อกอินแล้ว แนบตั๋วเหมือนกัน */
  var GATED={'.scanbtn':'scan','.c-hr':'hr','.c-fix':'fix','.c-car':'car','.c-maid':'maid','.c-risk':'risk','.c-cheer':'cheer','.c-sign':'sign'};

  var loginCard=document.getElementById('loginCard'),
      appMenu=document.getElementById('appMenu'),
      deptSel=document.getElementById('lgDept'),
      nameSel=document.getElementById('lgName'),
      pinIn=document.getElementById('lgPin'),
      lgBtn=document.getElementById('lgBtn'),
      lgErr=document.getElementById('lgErr'),
      lgWho=document.getElementById('lgWho'),
      lgOut=document.getElementById('lgOut');

  function b64urlToStr(s){ s=String(s).replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4)s+='='; var bin=atob(s); var by=Uint8Array.from(bin,function(c){return c.charCodeAt(0);}); return new TextDecoder('utf-8').decode(by); }
  function parseTok(t){ try{ if(!t)return null; var b=String(t).split('.')[0]; if(!b)return null; var p=JSON.parse(b64urlToStr(b)); return p; }catch(e){ return null; } }
  /* ตั๋วที่หมดอายุแล้วถือว่าใช้ไม่ได้ตั้งแต่ประตูพอร์ทัล
     (เดิมปล่อยผ่านเพื่อไม่ให้เด้ง login บ่อยตอนตั๋วอายุ 12 ชม. แต่กลายเป็นว่า
      ผู้ใช้เข้าเมนูได้ทั้งที่ทุกแอปปฏิเสธ แล้วกดกลับมาพอร์ทัลก็วนที่ตั๋วใบเดิม)
     ตอนนี้ต่ออายุอัตโนมัติ + ตาข่าย 1 ปี (04/10/2569) จึงแทบไม่มีใครเจอหน้าล็อกอินอีก */
  function liveTok(t){ var p=parseTok(t); if(!p)return null; if(p.exp&&Math.floor(Date.now()/1000)>p.exp)return null; return p; }
  function getTok(){ try{ return localStorage.getItem(TK)||''; }catch(e){ return ''; } }
  function setTok(t){ try{ if(t) localStorage.setItem(TK,t); else localStorage.removeItem(TK); }catch(e){} }
  function showErr(m){ lgErr.textContent=m||''; lgErr.className='err'+(m?' show':''); }

  var EMPS=[], BYDEPT={};
  function loadEmps(){
    fetch(AUTH+'/api/employees').then(function(r){return r.json();}).then(function(list){
      EMPS=list||[]; BYDEPT={};
      EMPS.forEach(function(e){ if(!e.dept)return; (BYDEPT[e.dept]=BYDEPT[e.dept]||[]).push(e); });
      var depts=Object.keys(BYDEPT).sort(function(a,b){return a.localeCompare(b,'th');});
      deptSel.innerHTML='<option value="">— เลือกแผนก —</option>'+depts.map(function(d){return '<option>'+esc(d)+'</option>';}).join('');
    }).catch(function(){ showErr('โหลดรายชื่อไม่สำเร็จ ลองรีเฟรช'); });
  }
  deptSel.addEventListener('change',function(){
    var arr=(BYDEPT[this.value]||[]).slice().sort(function(a,b){return a.name.localeCompare(b.name,'th');});
    nameSel.innerHTML='<option value="">'+(this.value?'— เลือกชื่อ —':'— เลือกแผนกก่อน —')+'</option>'+
      arr.map(function(e){return '<option value="'+esc(e.id)+'">'+esc(e.name)+'</option>';}).join('');
    showErr('');
  });

  function doLogin(){
    if(!deptSel.value){ showErr('กรุณาเลือกแผนก'); return; }
    var emp=nameSel.value; if(!emp){ showErr('กรุณาเลือกชื่อของคุณ'); return; }
    var pin=(pinIn.value||'').trim(); if(!/^\d{4,6}$/.test(pin)){ showErr('กรุณาใส่ PIN 4–6 หลัก'); return; }
    lgBtn.disabled=true; lgBtn.textContent='กำลังเข้า…'; showErr('');
    fetch(AUTH+'/api/verifypin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({for:'portal',empId:emp,pin:pin})})
      .then(function(r){return r.json();}).then(function(d){
        lgBtn.disabled=false; lgBtn.textContent='เข้าสู่ระบบ';
        if(!d||!d.ok){ showErr((d&&d.message)||'เข้าสู่ระบบไม่สำเร็จ'); return; }
        setTok(d.token);
        pinIn.value=''; showErr(''); showMenu();
      }).catch(function(){ lgBtn.disabled=false; lgBtn.textContent='เข้าสู่ระบบ'; showErr('เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง'); });
  }
  lgBtn.addEventListener('click',doLogin);
  pinIn.addEventListener('keydown',function(e){ if(e.key==='Enter')doLogin(); });

  /* บอกส่วนอื่นของหน้า (วิทยุแจ้งเหตุฉุกเฉิน) ว่าล็อกอิน/ออกจากระบบแล้ว — อ่านตั๋วผ่าน window.TIH ไม่ต้องรู้ที่เก็บ */
  function authChanged(){ try{ document.dispatchEvent(new Event('tih-auth')); }catch(e){} }
  window.TIH={ AUTH:AUTH, tok:function(){ var t=getTok(); return liveTok(t)?t:''; }, me:function(){ return liveTok(getTok()); }, menuOpen:function(){ return !appMenu.classList.contains('hidden'); } };
  function showLogin(msg){ appMenu.classList.add('hidden'); loginCard.classList.remove('hidden'); showErr(msg||''); ntUnload(); ntSync(); if(!EMPS.length)loadEmps(); authChanged(); }
  function showMenu(){
    var p=liveTok(getTok()); if(!p){ showLogin(); return; }
    lgWho.innerHTML=esc(p.name||'')+(p.dept?'<small>'+esc(p.dept)+'</small>':'');
    loginCard.classList.add('hidden'); appMenu.classList.remove('hidden');
    loadNotify();   // โหลดกรอบการแจ้งเตือนไว้ล่วงหน้า (ซ่อนอยู่) → ตัวเลขแดงขึ้นเลยโดยไม่ต้องกดเข้า
    ntSync();
    authChanged();
  }
  lgOut.addEventListener('click',function(){ setTok(''); showLogin(); });

  /* ---------- ต่ออายุตั๋ว (sliding) — พี่สั่ง 04/10/2569 "ไม่อยากกำหนดวัน"
     ใบเดิมที่ยังไม่หมดอายุแลกใบใหม่อายุเต็มกับเซิร์ฟเวอร์ (อ่านสิทธิ์สดจากทะเบียน) → ใช้งานอยู่ = ไม่มีวันหลุด
     จังหวะ 3 ที่: ตอนเปิด · ทุกชั่วโมง · ตอนกลับมาดูแท็บ (เครื่องหลับข้ามคืน timer ไม่วิ่ง) + กันยิงรัว 10 นาที
     สำเร็จเท่านั้นถึงเขียนทับ · ถูกปฏิเสธ (บัญชีปิด/ถูกระงับ) = ล้างตั๋ว เด้งหน้าล็อกอิน · เน็ตล้ม = ใช้ใบเดิมต่อ ไม่เตะ */
  var RENEW_AT=0;
  function renewTok(force){
    var t=getTok(); if(!liveTok(t)) return;
    if(!force && Date.now()-RENEW_AT<10*60*1000) return;
    RENEW_AT=Date.now();
    fetch(AUTH+'/api/verifypin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'renew',token:t})})
      .then(function(r){return r.json();}).then(function(d){
        if(d&&d.ok&&d.token){ setTok(d.token); }
        else if(d&&d.code==='unauth'){ setTok(''); showLogin(d.message||'เซสชันหมดอายุแล้ว กรุณาเข้าสู่ระบบใหม่'); }
      }).catch(function(){});
  }
  setInterval(function(){ renewTok(); }, 60*60*1000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) renewTok(); });

  /* ---------- การแจ้งเตือน (พี่สั่ง 04/10/2569 "ยกกล่องข้อความมาอยู่หน้านี้เลย" · เลือกแบบ 1 แถวปุ่มใหญ่ใต้ปุ่มสแกน)
     หน้าเดียวกับกระดิ่งในแอปสแกน/พอร์ทัล tihkpn = attendance-live/notify.html (notify-core.js + notify.js ชุดเดียว)
     · กรอบขอตั๋ว {type:'nt-need-ticket'} → ส่งให้ทาง postMessage {type:'nt-ticket',token} เฉพาะกรอบนี้ (ไม่แนบใน URL)
     · กรอบส่งยอดกลับ {type:'nt-count',n} → ตัวเลขแดงบนแถว
     · เปิดเต็มจอด้วย URL #notify → รีเฟรชแล้วยังอยู่หน้าเดิม · ปุ่มย้อนกลับของเครื่อง = ปิดกลับหน้าหลัก
     · #notify=<tab>/<sub> = การ์ดเด้งหลังสแกนในแอปสแกนส่งมา (04/10/2569) → บอกกรอบให้ลงตรงแท็บ/แท็บย่อยนั้น (ส่งไปกับ nt-ticket · เปิดอยู่แล้วส่ง nt-open) */
  var NOTIFY_ORIGIN=AUTH, NOTIFY_URL=AUTH+'/notify.html', NT_EMP=null;
  var ntView=document.getElementById('ntView'), ntFrame=document.getElementById('notifyFrame'), ntRow=document.getElementById('ntRow'), ntRowN=document.getElementById('ntRowN');
  function setNtCount(n){ n=+n||0; ntRowN.textContent=n>99?'99+':String(n); ntRowN.hidden=!(n>0); }
  function loadNotify(){
    var p=liveTok(getTok()), emp=(p&&p.emp!=null)?String(p.emp):'';
    if(!emp){ ntUnload(); return; }
    if(NT_EMP===emp && ntFrame.getAttribute('src')) return;   // โหลดไว้แล้วของคนนี้
    NT_EMP=emp; setNtCount(0); ntFrame.src=NOTIFY_URL;
  }
  function ntUnload(){ NT_EMP=null; NT_READY=false; NT_TOLD=''; setNtCount(0); if(ntFrame.getAttribute('src')) ntFrame.removeAttribute('src'); }   // ออกจากระบบ/ตั๋วหมด = ไม่ค้างของคนเดิม
  window.addEventListener('message',function(ev){
    if(ev.origin!==NOTIFY_ORIGIN || ev.source!==ntFrame.contentWindow) return;
    var m=ev.data||{};
    if(m.type==='nt-need-ticket'){ var t=getTok(); if(!liveTok(t)) t=''; var h=ntHash()||{}; NT_READY=true;
      try{ ntFrame.contentWindow.postMessage({type:'nt-ticket',token:t,tab:h.tab||'',sub:h.sub||''},NOTIFY_ORIGIN); }catch(e){} }
    else if(m.type==='nt-count'){ NT_READY=true; setNtCount(m.n); }
  });
  /* #notify หรือ #notify=<tab>/<sub> → {tab,sub} · ไม่ใช่ = null */
  var NT_READY=false, NT_TOLD='';
  function ntHash(){
    var m=/^#notify(?:=([^\/]*)(?:\/(.*))?)?$/.exec(location.hash||''); if(!m) return null;
    try{ return {tab:decodeURIComponent(m[1]||''), sub:decodeURIComponent(m[2]||'')}; }catch(e){ return {tab:'',sub:''}; }
  }
  /* กรอบเปิดอยู่แล้ว + แฮชบอกแท็บ → สั่งสลับ (ครั้งเดียวต่อค่าแฮช) · ถ้ากรอบยังไม่พร้อม แท็บจะไปกับ nt-ticket เอง */
  function ntTell(h){
    if(!h||!h.tab||!NT_READY) return;
    var key=h.tab+'/'+h.sub; if(NT_TOLD===key) return; NT_TOLD=key;
    try{ ntFrame.contentWindow.postMessage({type:'nt-open',tab:h.tab,sub:h.sub},NOTIFY_ORIGIN); }catch(e){}
  }
  function ntSync(){
    var h=ntHash(), open = !!h && !appMenu.classList.contains('hidden');
    ntView.classList.toggle('hidden',!open);
    document.body.classList.toggle('ntopen',open);
    if(open){ loadNotify(); ntTell(h); } else NT_TOLD='';
  }
  window.addEventListener('hashchange',ntSync);
  ntRow.addEventListener('click',function(){ if(ntHash()) ntSync(); else location.hash='notify'; });
  document.getElementById('ntBack').addEventListener('click',function(){
    try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){ location.hash=''; }
    ntSync();
  });

  /* กดการ์ด → แนบตั๋วแล้วไปตรง (เว็บของเราเองทุกใบแล้ว ไม่เหลือตัวที่ต้องเปิดในกรอบ app.html / หน้ากลาง go.html) */
  var INFRAME={};
  var warmed={};
  function warm(k){
    if(!INFRAME[k]||warmed[k])return; warmed[k]=1;
    var a=document.querySelector('a.c-'+k); var u=a&&a.getAttribute('href'); if(!u)return;
    try{ fetch(u,{mode:'no-cors',credentials:'omit',cache:'no-store',keepalive:true}); }catch(e){}
  }

  Object.keys(GATED).forEach(function(sel){
    document.querySelectorAll('a'+sel).forEach(function(a){
      var k=GATED[sel];
      a.addEventListener('touchstart',function(){ warm(k); },{passive:true});
      a.addEventListener('mouseenter',function(){ warm(k); });
      a.addEventListener('click',function(e){
        e.preventDefault();
        if(INFRAME[k]){ window.location.href='app.html?a='+k; return; }
        var url=a.getAttribute('href')||'', t=getTok();
        if(!liveTok(t)) t='';
        if(!url){ window.location.href='go.html?a='+k; return; }
        window.location.href=url+(t?((url.indexOf('?')<0?'?':'&')+'tk='+encodeURIComponent(t)):'');
      });
    });
  });

  /* boot: มีตั๋วที่ยังไม่หมดอายุ → เข้าเมนูเลย (จำจนกว่าจะกดออกจากระบบ) + ต่ออายุเบื้องหลัง
     ตั๋วหมดอายุ → ล้างทิ้งแล้วบอกให้เข้าใหม่ (ไม่งั้นเข้าเมนูได้แต่ทุกแอปปฏิเสธ)
     มาจากหน้าแอปที่บอกว่าตั๋วใช้ไม่ได้ (?relogin=1) → ล้างตั๋วทิ้งเลย ไม่ให้วนลูป */
  var wantRelogin=/[?&]relogin=1/.test(location.search);
  if(wantRelogin){ try{ history.replaceState(null,'',location.pathname+location.hash); }catch(e){} }
  var boot=liveTok(getTok());
  if(wantRelogin || !boot){
    var had=!!getTok();
    if(wantRelogin || had) setTok('');
    showLogin(had?'เซสชันหมดอายุแล้ว กรุณาเข้าสู่ระบบใหม่':'');
  } else {
    showMenu();
    renewTok(true);
  }
})();
</script>

<script>
/* ===================== วิทยุแจ้งเหตุฉุกเฉิน (พี่เคาะ 24/10/2569) =====================
   ใช้แจ้งเหตุฉุกเฉินเท่านั้น · ช่องเดียวทั้ง รพ. · ทุกคนพูดได้ · เก็บย้อนหลัง 7 วัน · ห้ามแปลงเสียงเป็นข้อความ (ไม่ส่งเสียงไปบริการภายนอก)
   - พูด: กดค้างปุ่มแดง = อัด (pointer events รองรับนิ้ว/เมาส์ · คีย์บอร์ดกด Space/Enter ค้าง) · ปล่อย = ส่ง · ลากออกนอกปุ่ม = ยกเลิก
          สั้นกว่า 0.7 วิ = ไม่ส่ง · ครบ 60 วิ ส่งเอง · ขอไมค์ครั้งแรกตอนกด · ปิดไมค์ทันทีที่อัดจบ (ไฟไมค์ไม่ค้าง)
   - ฟังสด (หน้าจอเปิดอยู่): Supabase Realtime ช่อง 'radio' ได้แค่ {id} → ขอ get ด้วยตั๋ว → เล่นเอง + แถบแดงบนจอ
          ต่อ Realtime ไม่ได้ = ถามทุก 20 วิ เฉพาะตอนจอเปิด (latest) · กลับมาดูจอ/ต่อใหม่ = เก็บตกคลิปใน 3 นาทีล่าสุด
          iOS บล็อกเสียงเล่นเอง → ปลดล็อกตอนผู้ใช้แตะจอครั้งแรก (เล่นเสียงเงียบสั้น ๆ ในตัวเล่นตัวเดียวกัน)
   - ปิดแอป/ล็อกจอ: web push จาก api/radio.js → sw.js โชว์แจ้งเตือน · แตะ = เปิด #radio=<id> เล่นคลิปนั้น
   - API: attendance-live/api/radio.js (cfg · send · list · get · latest) · สมัคร push: api/push.js (app:'portal') */
(function(){
  var T=window.TIH; if(!T) return;
  var API=T.AUTH+'/api/radio', PUSH_API=T.AUTH+'/api/push';
  var SB_JS='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js';
  var SB_SRI='sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK';
  var SEEN_KEY='tih_radio_seen';
  var MIN_MS=700, MAX_MS=60000, POLL_MS=20000, CATCHUP_MS=3*60000;
  function $(id){ return document.getElementById(id); }
  function pad(n){ return (n<10?'0':'')+n; }
  function mmss(ms){ var s=Math.max(0,Math.round((ms||0)/1000)); return Math.floor(s/60)+':'+pad(s%60); }
  /* เวลาในฐานเป็น UTC → แสดงเวลาไทย 24 ชม. ไม่ขึ้นกับโซนเวลาของเครื่อง */
  function bkk(at){ return new Date(Date.parse(at)+7*3600000); }
  function hhmm(at){ var d=bkk(at); return pad(d.getUTCHours())+':'+pad(d.getUTCMinutes()); }
  var TH_D=['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'], TH_M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  function dayLbl(at){
    var d=bkk(at), ds=d.toISOString().slice(0,10);
    var today=new Date(Date.now()+7*3600000).toISOString().slice(0,10), yest=new Date(Date.now()+7*3600000-86400000).toISOString().slice(0,10);
    if(ds===today) return 'วันนี้'; if(ds===yest) return 'เมื่อวาน';
    return TH_D[d.getUTCDay()]+' '+d.getUTCDate()+' '+TH_M[d.getUTCMonth()];
  }
  function api(action,body){
    var tk=T.tok(); if(!tk) return Promise.resolve({ok:false,code:'unauth',message:'ยังไม่ได้เข้าสู่ระบบ'});
    return fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({action:action,tk:tk},body||{}))}).then(function(r){ return r.json(); });
  }
  function getSeen(){ try{ return +localStorage.getItem(SEEN_KEY)||0; }catch(e){ return 0; } }
  function setSeen(id){ id=+id||0; if(id>getSeen()){ try{ localStorage.setItem(SEEN_KEY,String(id)); }catch(e){} } }

  /* ---------- ตัวเล่นเสียงตัวเดียวทั้งหน้า + ปลดล็อกเสียงตอนแตะจอครั้งแรก (iOS) ---------- */
  var AU=new Audio(); AU.preload='auto'; AU.setAttribute('playsinline','');
  var SILENT=(function(){   // WAV เงียบ 0.05 วิ สร้างในเครื่อง ไม่ต้องโหลดไฟล์
    var n=400, b=new ArrayBuffer(44+n), v=new DataView(b), w=function(o,s){ for(var i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i)); };
    w(0,'RIFF'); v.setUint32(4,36+n,true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,8000,true); v.setUint32(28,8000,true); v.setUint16(32,1,true); v.setUint16(34,8,true); w(36,'data'); v.setUint32(40,n,true);
    for(var i=0;i<n;i++) v.setUint8(44+i,128);
    try{ return URL.createObjectURL(new Blob([b],{type:'audio/wav'})); }catch(e){ return ''; }
  })();
  var unlocked=false, CUR=null, QUEUE=[];
  function unlock(){
    if(unlocked || CUR || !SILENT) return;
    unlocked=true;
    try{ AU.src=SILENT; var p=AU.play(); if(p&&p.then) p.then(function(){ if(!CUR) AU.pause(); offUnlock(); }).catch(function(){ unlocked=false; }); else offUnlock(); }catch(e){ unlocked=false; }
  }
  var UNLOCK_EV=['pointerdown','touchend','click','keydown'];
  function offUnlock(){ UNLOCK_EV.forEach(function(ev){ document.removeEventListener(ev,unlock,true); }); }
  UNLOCK_EV.forEach(function(ev){ document.addEventListener(ev,unlock,true); });

  /* ---------- แถบแจ้งเหตุบนสุดของจอ ---------- */
  var AL=$('rdAlert'), ALT=$('rdAT'), ALM=$('rdAM'), ALS=$('rdAS'), ALP=$('rdAPlay'), ALI=null;
  function alertFit(){   // ดันหน้าลงเท่าความสูงแถบ (ความสูงเปลี่ยนตามความยาวชื่อ/ความกว้างจอ)
    var on=AL.classList.contains('on');
    document.body.classList.toggle('rdal',on);
    if(on) document.documentElement.style.setProperty('--rdal',AL.offsetHeight+'px');
  }
  function alertShow(it,sub){
    ALI=it; ALT.textContent='เหตุฉุกเฉิน · คุณ'+(it.name||'');
    ALM.textContent=(it.dept?it.dept+' · ':'')+hhmm(it.at)+' น.';
    ALS.textContent=sub||''; AL.classList.add('on'); alertFit();
  }
  function alertHide(){ AL.classList.remove('on'); ALI=null; alertFit(); }
  window.addEventListener('resize',function(){ if(ALI) alertFit(); });
  function alertSub(t,btn){ ALS.textContent=t||''; if(btn) ALP.textContent=btn; }
  ALP.addEventListener('click',function(){ if(ALI) play(ALI,{user:true}); });
  $('rdAClose').addEventListener('click',function(){ if(CUR && CUR.it===ALI) stopPlay(); alertHide(); QUEUE=[]; });

  /* ---------- เล่นคลิป (เข้าคิว ไม่เล่นทับกัน · ไม่เล่นระหว่างกำลังอัด) ---------- */
  function play(it,o){
    o=o||{};
    if(!it || !it.url){ tihToast('เปิดเสียงนี้ไม่ได้ — ลองโหลดใหม่'); return; }
    if(REC){ QUEUE.push(it); return; }
    if(CUR && !o.user){ QUEUE.push(it); return; }
    stopPlay(true);
    CUR={it:it}; unlocked=true;
    AU.src=it.url; try{ AU.currentTime=0; }catch(e){}
    markList();
    if(ALI && ALI.id===it.id) alertSub('กำลังเล่นเสียง…','ฟังซ้ำ');
    var p=AU.play();
    if(p && p.catch) p.catch(function(){
      // เครื่องบล็อกเสียงเล่นเอง (ยังไม่เคยแตะจอ) → ให้แตะ "ฟัง" เอง
      if(CUR && CUR.it===it){ CUR=null; markList(); }
      if(!ALI || ALI.id!==it.id) alertShow(it);
      alertSub('แตะ "ฟัง" เพื่อเปิดเสียง','ฟัง');
    });
  }
  function stopPlay(keepQueue){ try{ AU.pause(); }catch(e){} CUR=null; if(!keepQueue) QUEUE=[]; markList(); }
  AU.addEventListener('timeupdate',function(){ if(CUR && ALI && CUR.it.id===ALI.id) alertSub('กำลังเล่น '+mmss(AU.currentTime*1000)+' / '+mmss(isFinite(AU.duration)&&AU.duration>0?AU.duration*1000:ALI.dur),'ฟังซ้ำ'); });   // webm บางเครื่องไม่รู้ความยาว → ใช้ค่าที่บันทึกไว้
  AU.addEventListener('ended',function(){
    var done=CUR&&CUR.it; CUR=null; markList();
    if(done && ALI && ALI.id===done.id) alertSub('เล่นจบแล้ว','ฟังซ้ำ');
    var nx=QUEUE.shift(); if(nx){ alertShow(nx); play(nx); }
  });
  AU.addEventListener('error',function(){ if(CUR && AU.src!==SILENT){ var it=CUR.it; CUR=null; markList(); if(ALI&&ALI.id===it.id) alertSub('เล่นเสียงนี้ไม่ได้ในเครื่องนี้ — ลองโหลดใหม่','ฟังซ้ำ'); } });

  /* ---------- มีคนพูดเข้ามา (Realtime / ถามซ้ำ / service worker / แตะแจ้งเตือน) ---------- */
  var BUSY={};
  function incoming(id,how){
    id=+id||0; if(!id || !T.tok() || !ON) return;
    var force=(how==='click'||how==='hash');
    if(!force && id<=getSeen()) return;
    if(BUSY[id]) return; BUSY[id]=1;
    setSeen(id);
    api('get',{id:id}).then(function(d){
      BUSY[id]=0;
      if(!d||!d.ok){ if(force) tihToast((d&&d.message)||'เปิดเสียงนี้ไม่ได้'); return; }
      var it=d.item;
      if(it.mine && !force) return;   // เสียงของตัวเอง ไม่ต้องเล่นกลับ
      if(VIEW_OPEN) loadList(true);
      if(REC){ alertShow(it,'จะเล่นเมื่ออัดเสียงของคุณเสร็จ'); QUEUE.push(it); }
      else if(!CUR || force){ alertShow(it,'กำลังเปิดเสียง…'); play(it,{user:force}); }
      else QUEUE.push(it);
    }).catch(function(){ BUSY[id]=0; });
  }
  /* เช็กคลิปล่าสุด: ใหม่กว่าที่เคยเห็น + ไม่เกิน 3 นาที = เล่น · เก่ากว่านั้นแค่จำไว้ (ครั้งแรกในเครื่องนี้ = จำอย่างเดียว ไม่เล่นย้อน) */
  var first=true;
  function checkLatest(){
    if(!T.tok() || !ON) return;
    api('latest').then(function(d){
      if(!d||!d.ok) return;
      var fresh=d.at && (Date.now()-Date.parse(d.at))<CATCHUP_MS;
      if(first && !getSeen()){ first=false; if(!fresh){ setSeen(d.id); return; } }
      first=false;
      if(d.id>getSeen()){ if(fresh) incoming(d.id,'poll'); else setSeen(d.id); }
    }).catch(function(){});
  }

  /* ---------- Realtime (ช่องสาธารณะ ได้แค่ id) + ทางสำรองถามทุก 20 วิ ---------- */
  /* ON = หลังบ้านตอบ cfg ok (ช่วงทดลอง: เฉพาะรหัสพนักงานใน PILOT_EMPS ของ api/radio.js · พี่สั่ง 24/10/2569 ให้เห็นคนเดียว)
     ยังไม่ ok = ซ่อนปุ่ม/แถบชวน/ไม่ฟังเสียง ไม่ถามเซิร์ฟเวอร์ */
  var ON=false;
  var CFG=null, SB=null, CH=null, rtOk=false, pollT=null, sbLoading=null;
  function loadSb(){
    if(window.supabase && window.supabase.createClient) return Promise.resolve();
    if(sbLoading) return sbLoading;
    sbLoading=new Promise(function(res,rej){
      var s=document.createElement('script'); s.src=SB_JS; s.integrity=SB_SRI; s.crossOrigin='anonymous'; s.async=true;
      s.onload=function(){ res(); }; s.onerror=function(){ sbLoading=null; rej(new Error('load')); };
      document.head.appendChild(s);
    });
    return sbLoading;
  }
  function rtStart(){
    if(CH || !CFG || !CFG.rt) return;
    loadSb().then(function(){
      if(CH || !T.tok()) return;
      SB=SB||window.supabase.createClient(CFG.rt.url,CFG.rt.key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
      CH=SB.channel(CFG.rt.channel||'radio');
      CH.on('broadcast',{event:'new'},function(m){ incoming(m&&m.payload&&m.payload.id,'rt'); })
        .subscribe(function(st){
          var was=rtOk; rtOk=(st==='SUBSCRIBED');
          if(rtOk && !was) checkLatest();   // ต่อได้/ต่อใหม่หลังเครื่องหลับ = เก็บตกที่พลาดไป
        });
    }).catch(function(){ rtOk=false; });
  }
  function rtStop(){ try{ if(CH&&SB) SB.removeChannel(CH); }catch(e){} CH=null; rtOk=false; }
  function pollStart(){ if(pollT) return; pollT=setInterval(function(){ if(!rtOk && document.visibilityState==='visible') checkLatest(); },POLL_MS); }
  function pollStop(){ clearInterval(pollT); pollT=null; }
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible' && T.tok()){ checkLatest(); pushCheck(); } });

  /* ข้อความจาก service worker: มี push เข้ามาตอนจอเปิด / แตะแจ้งเตือนตอนแอปเปิดค้างอยู่ */
  if('serviceWorker' in navigator){
    navigator.serviceWorker.addEventListener('message',function(ev){
      var m=ev.data||{}; if(m.type!=='radio') return;
      if(m.click){ if(!rdHash()) location.hash='radio='+m.id; else incoming(m.id,'click'); }
      else incoming(m.id,'sw');
    });
  }

  /* ---------- ปุ่มกดค้างพูด ---------- */
  var PTT=$('rdPtt'), PT=$('rdT'), PD=$('rdD'), PTM=$('rdTm');
  var IDLE_T=PT.innerHTML, IDLE_D=PD.textContent;
  var REC=null, SENDING=false;
  function ui(st,sec){
    PTT.classList.toggle('rec',st==='rec'); PTT.classList.toggle('out',st==='out'); PTT.classList.toggle('busy',st==='wait'||st==='send');
    PTM.classList.toggle('hidden',!(st==='rec'||st==='out'));
    if(st==='idle'){ PT.innerHTML=IDLE_T; PD.textContent=IDLE_D; }
    else if(st==='wait'){ PT.textContent='กำลังเปิดไมค์…'; PD.textContent='กดค้างไว้ พูดได้เมื่อเวลาเริ่มเดิน'; }
    else if(st==='rec'){ PT.textContent='ปล่อยนิ้ว = ส่ง'; PD.textContent='ลากออกนอกปุ่ม = ยกเลิก'; }
    else if(st==='out'){ PT.textContent='ปล่อยตอนนี้ = ยกเลิก'; PD.textContent='ลากกลับเข้าปุ่มเพื่ออัดต่อ'; }
    else if(st==='send'){ PT.textContent='กำลังส่ง…'; PD.textContent='อย่าเพิ่งปิดแอป'; }
  }
  function tick(){
    if(!REC||!REC.t0) return;
    var ms=Date.now()-REC.t0;
    PTM.innerHTML=mmss(ms)+'<small> / 1:00</small>';
    PTM.classList.toggle('warn',ms>=MAX_MS-10000);
    if(ms>=MAX_MS) endRec(false,true);
  }
  function pickMime(){
    if(!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
    var c=['audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'];
    for(var i=0;i<c.length;i++){ try{ if(MediaRecorder.isTypeSupported(c[i])) return c[i]; }catch(e){} }
    return '';
  }
  function canRecord(){ return !!(window.MediaRecorder && navigator.mediaDevices && navigator.mediaDevices.getUserMedia); }
  function stopTracks(r){ try{ r.stream && r.stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){} }

  function startRec(pid){
    if(REC || SENDING) return;
    if(!T.tok()){ tihToast('เข้าสู่ระบบก่อน แล้วค่อยแจ้งเหตุ'); return; }
    if(!canRecord()){ tihToast('เบราว์เซอร์นี้อัดเสียงไม่ได้ — เปิดด้วย Chrome หรือ Safari รุ่นใหม่'); return; }
    if(CUR) stopPlay(true);
    var r=REC={pid:pid, down:Date.now(), t0:0, out:false, chunks:[], released:false};
    ui('wait');
    navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}}).then(function(stream){
      r.stream=stream;
      if(REC!==r || r.released){   // ปล่อยนิ้วก่อนไมค์พร้อม (เช่นครั้งแรกที่เครื่องถามสิทธิ์ไมค์)
        stopTracks(r);
        if(r.released==='early') tihToast('ไมค์พร้อมแล้ว — กดค้างไว้แล้วพูด');
        return;
      }
      var m=pickMime(), opt={audioBitsPerSecond:32000}; if(m) opt.mimeType=m;
      var rec; try{ rec=new MediaRecorder(stream,opt); }catch(e){ try{ rec=new MediaRecorder(stream); }catch(e2){ stopTracks(r); REC=null; ui('idle'); tihToast('เครื่องนี้อัดเสียงไม่ได้'); return; } }
      r.rec=rec; r.mime=rec.mimeType||m||'';
      rec.ondataavailable=function(ev){ if(ev.data && ev.data.size) r.chunks.push(ev.data); };
      rec.onstop=function(){ stopTracks(r); if(r.onstop) r.onstop(); };
      rec.start();
      r.t0=Date.now(); r.iv=setInterval(tick,200); tick();
      ui(r.out?'out':'rec');
      if(navigator.vibrate){ try{ navigator.vibrate(30); }catch(e){} }
    }).catch(function(err){
      if(REC===r){ REC=null; ui('idle'); }
      var n=err&&err.name;
      tihToast(n==='NotAllowedError'||n==='SecurityError' ? 'ยังไม่ได้อนุญาตให้ใช้ไมค์ — เปิดสิทธิ์ไมโครโฟนของแอปนี้ในตั้งค่าเครื่อง แล้วกดค้างใหม่'
              : n==='NotFoundError' ? 'ไม่พบไมโครโฟนในเครื่องนี้' : 'เปิดไมค์ไม่ได้ ลองใหม่อีกครั้ง');
    });
  }
  /* จบการอัด: cancel = ยกเลิก (ลากออก/ระบบดึงนิ้วไป) · auto = ครบ 60 วิ */
  function endRec(cancel,auto){
    var r=REC; if(!r) return;
    REC=null; clearInterval(r.iv); PTM.classList.remove('warn');
    if(!r.rec){ r.released='early'; ui('idle'); flushQueue(); return; }   // ไมค์ยังไม่พร้อม (เครื่องกำลังถามสิทธิ์) — บอกผลตอนไมค์ตอบ
    var dur=Date.now()-r.t0;
    if(cancel || dur<MIN_MS || Date.now()-r.down<MIN_MS){
      r.onstop=null; try{ r.rec.stop(); }catch(e){ stopTracks(r); }
      ui('idle'); tihToast(cancel?'ยกเลิกแล้ว ไม่ได้ส่ง':'กดค้างไว้แล้วพูด'); flushQueue(); return;
    }
    SENDING=true; ui('send');
    r.onstop=function(){
      var type=r.mime||(r.chunks[0]&&r.chunks[0].type)||'';
      var blob=new Blob(r.chunks,{type:type});
      send(blob,type,Math.min(dur,MAX_MS),auto);
    };
    try{ r.rec.stop(); }catch(e){ stopTracks(r); SENDING=false; ui('idle'); tihToast('อัดเสียงไม่สำเร็จ ลองใหม่'); }
  }
  function flushQueue(){ var nx=QUEUE.shift(); if(nx){ alertShow(nx); play(nx); } }
  function b64(blob){ return new Promise(function(res,rej){ var fr=new FileReader(); fr.onload=function(){ res(String(fr.result).split(',')[1]||''); }; fr.onerror=rej; fr.readAsDataURL(blob); }); }
  function send(blob,mime,dur,auto){
    if(!blob.size){ SENDING=false; ui('idle'); tihToast('ไม่ได้ยินเสียง ลองกดค้างแล้วพูดใหม่'); flushQueue(); return; }
    var tries=0;
    b64(blob).then(function(data){
      function go(){
        tries++;
        return api('send',{mime:mime,dur:dur,audio:data}).catch(function(e){
          if(tries<2) return new Promise(function(r){ setTimeout(r,1500); }).then(go);   // เน็ตสะดุด ลองอีกครั้งเดียว
          throw e;
        });
      }
      return go();
    }).then(function(d){
      SENDING=false; ui('idle');
      if(!d||!d.ok){ tihToast((d&&d.message)||'ส่งไม่สำเร็จ ลองกดค้างพูดใหม่'); return; }
      setSeen(d.id);
      var n=d.push&&d.push.sent||0;
      tihToast((auto?'ครบ 60 วินาที ':'')+'ส่งเสียงแจ้งเหตุแล้ว'+(n?' · เด้งเตือนมือถือ '+n+' เครื่อง':''));
      if(VIEW_OPEN) loadList(true);
    }).catch(function(){ SENDING=false; ui('idle'); tihToast('ส่งไม่สำเร็จ — ตรวจสัญญาณเน็ต แล้วกดค้างพูดใหม่'); })
      .then(flushQueue);
  }
  function inside(e){ var b=PTT.getBoundingClientRect(), m=16; return e.clientX>=b.left-m && e.clientX<=b.right+m && e.clientY>=b.top-m && e.clientY<=b.bottom+m; }
  PTT.addEventListener('pointerdown',function(e){
    if(e.button>0) return;
    e.preventDefault(); unlock();
    try{ PTT.setPointerCapture(e.pointerId); }catch(x){}
    startRec(e.pointerId);
  });
  PTT.addEventListener('pointermove',function(e){
    if(!REC || REC.pid!==e.pointerId) return;
    var out=!inside(e); if(out===REC.out) return;
    REC.out=out; if(REC.rec) ui(out?'out':'rec');
  });
  PTT.addEventListener('pointerup',function(e){ if(REC && REC.pid===e.pointerId) endRec(REC.out); });
  PTT.addEventListener('pointercancel',function(e){ if(REC && REC.pid===e.pointerId) endRec(true); });
  PTT.addEventListener('contextmenu',function(e){ e.preventDefault(); });
  PTT.addEventListener('click',function(e){ e.preventDefault(); });
  PTT.addEventListener('keydown',function(e){ if((e.key===' '||e.key==='Enter') && !e.repeat){ e.preventDefault(); startRec('key'); } });
  PTT.addEventListener('keyup',function(e){ if((e.key===' '||e.key==='Enter') && REC && REC.pid==='key'){ e.preventDefault(); endRec(false); } });
  PTT.addEventListener('blur',function(){ if(REC && REC.pid==='key') endRec(true); });
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='hidden' && REC) endRec(false); });   // ล็อกจอกลางคัน = ส่งเท่าที่พูดไป

  /* ---------- หน้าย้อนหลัง #radio (เต็มจอแบบ #notify) ---------- */
  var VIEW=$('rdView'), LIST=$('rdList'), VIEW_OPEN=false, ITEMS=[], WANT=0, LOADED_AT=0;
  var I_PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>', I_STOP='<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>';
  function rdHash(){ var m=/^#radio(?:=(\d+))?$/.exec(location.hash||''); return m?{id:+(m[1]||0)}:null; }
  function markList(){
    if(!VIEW_OPEN) return;
    var cur=CUR&&CUR.it&&CUR.it.id;
    LIST.querySelectorAll('.rditem').forEach(function(el){
      var on=(+el.getAttribute('data-id')===cur); el.classList.toggle('playing',on);
      var b=el.querySelector('.rdplay'); if(b){ b.innerHTML=on?I_STOP:I_PLAY; b.setAttribute('aria-label',on?'หยุด':'ฟัง'); }
    });
  }
  function renderList(d){
    if(!d||!d.ok){ LIST.innerHTML='<div class="rdempty">'+esc((d&&d.message)||'โหลดไม่สำเร็จ')+'<br>แตะ "โหลดใหม่" ด้านบนเพื่อลองอีกครั้ง</div>'; return; }
    ITEMS=d.items||[];
    if(!ITEMS.length){ LIST.innerHTML='<div class="rdempty">ยังไม่มีเสียงแจ้งเหตุในช่วง 7 วันที่ผ่านมา<br>ถ้ามีเหตุฉุกเฉิน กลับไปหน้าหลักแล้วกดค้างปุ่มแดงเพื่อพูด</div>'; return; }
    LIST.innerHTML=ITEMS.map(function(it){
      return '<div class="rditem" data-id="'+it.id+'">'+
        '<button type="button" class="rdplay" data-id="'+it.id+'" aria-label="ฟัง"'+(it.url?'':' disabled')+'>'+I_PLAY+'</button>'+
        '<div class="rw"><b>'+hhmm(it.at)+'</b><small>'+esc(dayLbl(it.at))+'</small></div>'+
        '<div class="rn"><b>คุณ'+esc(it.name)+(it.mine?' (ฉัน)':'')+'</b><small>'+esc(it.dept||'')+'</small></div>'+
        '<div class="rl">'+mmss(it.dur)+'</div></div>';
    }).join('')+(d.truncated?'<div class="rdempty">แสดง '+ITEMS.length+' รายการล่าสุด</div>':'');
    markList();
  }
  function loadList(quiet){
    if(!quiet) LIST.innerHTML='<div class="rdempty">กำลังโหลด…</div>';
    return api('list').then(function(d){ LOADED_AT=Date.now(); renderList(d); return d; })
      .catch(function(){ renderList({ok:false,message:'เชื่อมต่อไม่ได้'}); });
  }
  LIST.addEventListener('click',function(e){
    var b=e.target.closest('.rdplay'); if(!b) return;
    var id=+b.getAttribute('data-id'), it=ITEMS.filter(function(x){ return x.id===id; })[0];
    if(CUR && CUR.it.id===id){ stopPlay(); return; }
    if(Date.now()-LOADED_AT>50*60000){ loadList(true).then(function(){ var n=ITEMS.filter(function(x){ return x.id===id; })[0]; if(n) play(n,{user:true}); }); return; }   // ลิงก์ฟังอายุ 1 ชม.
    if(it) play(it,{user:true});
  });
  function rdSync(){
    var h=rdHash(), open=!!h && ON && T.menuOpen() && !!T.tok();
    VIEW.classList.toggle('hidden',!open); document.body.classList.toggle('rdopen',open);
    if(open && !VIEW_OPEN){ VIEW_OPEN=true; loadList(); }
    else if(!open) VIEW_OPEN=false;
    if(open && h.id){
      WANT=h.id;
      try{ history.replaceState(null,'',location.pathname+location.search+'#radio'); }catch(e){}   // รีเฟรชแล้วอยู่หน้าเดิม ไม่เล่นซ้ำเอง
      incoming(WANT,'hash');
    }
  }
  window.addEventListener('hashchange',rdSync);
  $('rdLog').addEventListener('click',function(){ if(rdHash()) rdSync(); else location.hash='radio'; });
  $('rdBack').addEventListener('click',function(){ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){ location.hash=''; } rdSync(); });
  $('rdReload').addEventListener('click',function(){ loadList(); });

  /* ---------- แถบชวนเปิดรับแจ้งเหตุตอนปิดแอป/ล็อกจอ (ฝังในหน้า ค้างจนกว่าเปิดสำเร็จ) ---------- */
  var PB=$('rdPush'), PBT=$('rdPushT'), PBD=$('rdPushD'), PBB=$('rdPushBtn'), PBS=$('rdPushSlot');
  var iOS=(typeof isIOS!=='undefined'&&isIOS) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  var standaloneNow=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  var pushBusy=false;
  function pbShow(t,d,btn){
    PB.classList.remove('hidden'); PBT.textContent=t; PBD.innerHTML=d||'';
    PBB.classList.toggle('hidden',!btn); if(btn){ PBB.textContent=btn; PBB.disabled=pushBusy; }
  }
  function pbHide(){ PB.classList.add('hidden'); }
  /* iPhone ที่ยังไม่ได้เพิ่มลงหน้าจอโฮม: ใช้กล่องวิธีติดตั้ง (installBar) ตัวเดิม ย้ายมาไว้ในแถบนี้ ไม่ซ้ำสองที่ */
  function useInstallBar(){ var ib=$('installBar'); if(ib && ib.parentNode!==PBS){ PBS.appendChild(ib); } if(ib) ib.style.display='block'; }
  function deniedHelp(){
    if(iOS) return 'เปิดได้ที่ <b>ตั้งค่า → การแจ้งเตือน → ระบบงาน TIH → อนุญาตการแจ้งเตือน</b> แล้วกลับมาหน้านี้';
    if(/android/i.test(navigator.userAgent)) return 'เปิดได้ที่ <b>ตั้งค่าเครื่อง → แอป → ระบบงาน TIH (หรือ Chrome) → การแจ้งเตือน → อนุญาต</b> หรือแตะรูปแม่กุญแจข้างช่องที่อยู่เว็บ → สิทธิ์ → การแจ้งเตือน แล้วกลับมาหน้านี้';
    return 'คลิกรูปแม่กุญแจข้างช่องที่อยู่เว็บ → การแจ้งเตือน → อนุญาต แล้วโหลดหน้านี้ใหม่';
  }
  function b64ToU8(s){ var p='='.repeat((4-s.length%4)%4), b=(s+p).replace(/-/g,'+').replace(/_/g,'/'), raw=atob(b), out=new Uint8Array(raw.length); for(var i=0;i<raw.length;i++) out[i]=raw.charCodeAt(i); return out; }
  function pushPost(body){ return fetch(PUSH_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){ return r.json(); }); }
  function vapidKey(){
    if(CFG && CFG.vapid) return Promise.resolve(CFG.vapid);
    return pushPost({action:'key'}).then(function(k){ if(!k||!k.ok||!k.ready) throw new Error('เซิร์ฟเวอร์ยังไม่พร้อมส่งแจ้งเตือน'); return k.key; });
  }
  function register(sub){
    var me=T.me()||{};
    return pushPost({action:'subscribe',empId:String(me.emp),tk:T.tok(),app:'portal',sub:sub.toJSON?sub.toJSON():sub,ua:navigator.userAgent})
      .then(function(r){ if(!r||!r.ok) throw new Error((r&&r.message)||'เปิดรับไม่สำเร็จ'); return r; });
  }
  function pushSupported(){ return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window); }
  var PUSH_OK_AT=0;
  function pushCheck(force){
    if(!T.tok() || !ON){ pbHide(); return; }
    if(!force && PB.classList.contains('hidden') && Date.now()-PUSH_OK_AT<10*60000) return;   // เพิ่งยืนยันว่าเปิดรับอยู่ ไม่ต้องถามเซิร์ฟเวอร์ทุกครั้งที่กลับมาดูจอ
    if(iOS && !standaloneNow){
      pbShow('iPhone: เพิ่มแอปลงหน้าจอโฮมก่อน จึงจะได้ยินแจ้งเหตุตอนล็อกจอ','ทำตามขั้นตอนด้านล่าง แล้วเปิดแอปจากไอคอนบนหน้าจอโฮม เข้าสู่ระบบ แล้วกด "เปิดรับแจ้งเหตุฉุกเฉิน"');
      useInstallBar(); return;
    }
    if(!pushSupported()){
      pbShow('เบราว์เซอร์นี้รับแจ้งเหตุตอนปิดแอปไม่ได้','เปิดหน้านี้ด้วย Chrome (Android) หรือ Safari (iPhone) แล้วเพิ่มลงหน้าจอโฮม');
      useInstallBar(); return;
    }
    if(Notification.permission==='denied'){ pbShow('เครื่องนี้ปิดการแจ้งเตือนของแอปนี้ไว้ — จะไม่ได้ยินแจ้งเหตุตอนล็อกจอ',deniedHelp()); return; }
    navigator.serviceWorker.ready.then(function(reg){ return reg.pushManager.getSubscription(); }).then(function(sub){
      if(!sub || Notification.permission!=='granted'){ pbNeed(); return; }
      return pushPost({action:'settings',endpoint:sub.endpoint}).then(function(r){
        var sv=r&&r.sub, me=T.me()||{};
        if(sv && sv.enabled!==false && String(sv.emp_id)===String(me.emp)){ PUSH_OK_AT=Date.now(); pbHide(); return; }
        return register(sub).then(function(){ PUSH_OK_AT=Date.now(); pbHide(); });   // อนุญาตไว้แล้ว แค่ผูกเครื่องนี้กับคนที่เข้าระบบอยู่ (เครื่องเป็นของคนล่าสุด)
      });
    }).catch(function(){ pbNeed(); });
  }
  function pbNeed(msg){ pbShow('เครื่องนี้ยังไม่รับแจ้งเหตุตอนล็อกจอ',msg||'เปิดไว้ ถ้ามีคนแจ้งเหตุฉุกเฉิน มือถือจะเด้งเตือนแม้ปิดแอปอยู่','เปิดรับแจ้งเหตุฉุกเฉิน'); }
  function askPerm(){ return new Promise(function(res){ var p=Notification.requestPermission(function(x){ res(x); }); if(p&&p.then) p.then(res); }); }
  PBB.addEventListener('click',function(){
    if(pushBusy) return; pushBusy=true; PBB.disabled=true; PBB.textContent='กำลังเปิด…';
    askPerm().then(function(p){
      if(p!=='granted'){ var e=new Error(p==='denied'?'denied':'later'); throw e; }
      return navigator.serviceWorker.ready.then(function(reg){
        return reg.pushManager.getSubscription().then(function(s){
          return s || vapidKey().then(function(k){ return reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(k)}); });
        });
      });
    }).then(register).then(function(){
      pushBusy=false; PUSH_OK_AT=Date.now(); pbHide(); tihToast('เปิดรับแจ้งเหตุฉุกเฉินบนเครื่องนี้แล้ว');
    }).catch(function(e){
      pushBusy=false;
      if(e&&e.message==='denied'){ pbShow('เครื่องนี้ปิดการแจ้งเตือนของแอปนี้ไว้ — จะไม่ได้ยินแจ้งเหตุตอนล็อกจอ',deniedHelp()); return; }
      if(e&&e.message==='later'){ pbNeed('ยังไม่ได้กดอนุญาต — กดปุ่มอีกครั้ง แล้วเลือก "อนุญาต"'); return; }
      pbNeed(esc((e&&e.message)||'เปิดรับไม่สำเร็จ')+' — ลองกดอีกครั้ง');
    });
  });

  /* ---------- เริ่ม/หยุดตามการเข้าสู่ระบบ ---------- */
  function off(){
    ON=false; $('rdRow').classList.add('hidden');
    rtStop(); pollStop(); stopPlay(); alertHide(); pbHide(); rdSync();
    if(REC) endRec(true);
  }
  var bootSeq=0;
  function boot(){
    var seq=++bootSeq;
    if(!(T.tok() && T.menuOpen())){ off(); return; }
    /* เปิดได้เฉพาะเมื่อหลังบ้านตอบ ok (คนนอกช่วงทดลองได้ code 'pilot') · ผลที่มาช้ากว่าการเข้า/ออกระบบรอบใหม่ = ทิ้ง */
    api('cfg').then(function(d){
      if(seq!==bootSeq) return;
      if(!(d&&d.ok)){ off(); return; }
      CFG=d; ON=true; $('rdRow').classList.remove('hidden');
      rtStart(); pollStart(); checkLatest(); pushCheck(true); rdSync();
    }).catch(function(){ if(seq===bootSeq) off(); });
  }
  document.addEventListener('tih-auth',boot);
  boot();
})();
</script>
