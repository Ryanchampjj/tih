<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thai International Hospital Phangan — ศูนย์รวมระบบงาน</title>
<meta name="theme-color" content="#2B4CA0">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ระบบงาน TIH">
<link rel="apple-touch-icon" href="icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2B4CA0;--red:#E8252B;--bg:#AACCD6;--card:#FFFFFF;
    --text:#1F2A44;--muted:#6B7385;--border:#E4E8F2;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Sarabun',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 16px 48px;}
  .wrap{width:100%;max-width:880px;}
  header{text-align:center;margin-bottom:32px;}
  .logo{width:100%;max-width:560px;height:auto;margin:0 auto 18px;display:block;}
  .sub{font-size:16px;color:var(--muted);font-weight:500;}
  .divider{width:64px;height:4px;border-radius:2px;background:var(--red);margin:14px auto 0;}
  /* กริดไร้ขอบสไตล์ Chobani — ไทล์จัตุรัสชนกันสนิท 2 คอลัมน์ */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border-radius:18px;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.28);}
  .tile{position:relative;display:block;aspect-ratio:1/1;overflow:hidden;text-decoration:none;-webkit-tap-highlight-color:transparent;background:#e9edf3;}
  .tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .28s ease;}
  .tile:hover img{transform:scale(1.045);}
  .tile:active img{transform:scale(1.0);}
  .tile:focus-visible{outline:3px solid #fff;outline-offset:-4px;}
  /* การ์ด "ยังไม่เปิดใช้" */
  .tile.soon{cursor:default;}
  .tile.soon img{filter:brightness(.86) saturate(.9);}
  .tile.soon:hover img{transform:none;}
  .soonbadge{position:absolute;top:12px;right:12px;background:rgba(20,25,45,.74);color:#fff;font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:20px;letter-spacing:.2px;}
  /* การ์ดตกแต่ง กดไม่ได้ */
  .tile.deco{cursor:default;}
  .tile.deco:hover img{transform:none;}
  #toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(18px);background:rgba(20,25,45,.95);color:#fff;padding:13px 22px;border-radius:12px;font-size:15px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:88vw;text-align:center;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  footer{margin-top:40px;font-size:13px;color:var(--muted);text-align:center;}
  .scanbtn{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#2B4CA0,#3A63C8);color:#fff;border-radius:16px;padding:20px 22px;text-decoration:none;margin-bottom:18px;box-shadow:0 12px 22px rgba(0,0,0,.30);transition:transform .15s ease,box-shadow .15s ease;}
  .scanbtn:hover{transform:translateY(-3px);box-shadow:0 18px 34px rgba(0,0,0,.40);}
  .scanbtn:active{transform:scale(.99);}
  .scanbtn .sico{width:54px;height:54px;border-radius:14px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .scanbtn .sico svg{width:30px;height:30px;stroke:#fff;}
  .scanbtn .t{font-size:20px;font-weight:600;line-height:1.15;}
  .scanbtn .d{font-size:13px;opacity:.92;margin-top:3px;}
  .scanbtn .ar{margin-left:auto;font-size:24px;line-height:1;}
  @media (max-width:600px){body{padding:22px 12px 34px;}.grid{border-radius:14px;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="logo.png" alt="Thai International Hospital Phangan">
    <div class="divider"></div>
  </header>

  <a class="scanbtn" href="https://attendance-live-thaiinter.vercel.app/">
    <span class="sico"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2"/><path d="M16 4h2a2 2 0 0 1 2 2v2"/><path d="M20 16v2a2 2 0 0 1-2 2h-2"/><path d="M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 10.5v1"/><path d="M15 10.5v1"/><path d="M9 14.5c1 1 5 1 6 0"/></svg></span>
    <span><span class="t">สแกนหน้า เข้า/ออกงาน</span><span class="d">ลงเวลาทำงานประจำวัน</span></span>
    <span class="ar">&#8594;</span>
  </a>

  <nav class="grid" aria-label="เมนูระบบงาน">

    <a class="tile c-hr" href="https://script.google.com/macros/s/AKfycbwshwpfmuG9FDqbxpmn3iwxoT-JiHSXtRf16pJVjnKJy7fpMjh1TXfp4lm09hMnowtT/exec">
      <img src="hr.png" alt="ระบบงาน HR">
    </a>

    <a class="tile c-fix" href="https://script.google.com/macros/s/AKfycbw2EGIH626woM3X4BiX7oJPP-otiB0RAXl7H8ZelU2RdVvvuJltmGOOYbv7stqi8mD2/exec?view=request">
      <img src="fix.png" alt="แจ้งซ่อม">
    </a>

    <a class="tile c-car" href="https://script.google.com/macros/s/AKfycbyeeGoVjCFsqno3gh3TKphiD7X18cSa7OOh7Gu8EIMCCJw54LkpD0_jiZJvK_59I2uN/exec">
      <img src="car.png" alt="แจ้งขอใช้รถ">
    </a>

    <a class="tile c-maid" href="https://script.google.com/macros/s/AKfycbxZ0PviqiCfoAoRqKoHaGzsvDnOAG96C2gY6hcUq_sNU8fVNX60eFLGnwvL7MEdJf0R2Q/exec">
      <img src="maid.png" alt="แจ้งขอรับบริการแม่บ้าน">
    </a>

    <a class="tile c-risk" href="https://incident-report-one.vercel.app/">
      <img src="risk.png" alt="แจ้งความเสี่ยง">
    </a>

    <a class="tile c-cheer soon" href="#" onclick="return notReady()" aria-label="แจ้งชื่นชม (ยังไม่เปิดใช้งาน)">
      <img src="cheer.png" alt="แจ้งชื่นชม">
      <span class="soonbadge">เร็ว ๆ นี้</span>
    </a>

    <a class="tile c-sign" href="https://incident-report-one.vercel.app/sign.html">
      <img src="sign.png" alt="ส่งเอกสารให้ ผอ. เซ็น">
    </a>

    <div class="tile deco" aria-hidden="true">
      <img src="goodday.png" alt="">
    </div>

  </nav>

  <div id="toast" role="status" aria-live="polite"></div>

  <div id="installBar" style="display:none;margin:20px auto 0;background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:0 8px 18px rgba(0,0,0,.12);">
    <button id="installBtn" style="display:none;width:100%;padding:14px;border:none;border-radius:12px;background:#2B4CA0;color:#fff;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;margin-bottom:10px;">ติดตั้งแอปลงเครื่อง</button>
    <div id="installHint" style="font-size:13.5px;color:#444;line-height:1.7;"></div>
  </div>

<script>
  /* toast + การ์ดที่ยังไม่เปิดใช้ */
  function tihToast(t){var el=document.getElementById('toast');if(!el)return;el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('show');},2400);}
  function notReady(){tihToast('ระบบแจ้งชื่นชมยังไม่เปิดใช้งาน — เปิดเร็ว ๆ นี้');return false;}
</script>

<script>
  var ua=navigator.userAgent||'';
  var standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  var isIOS=/iphone|ipad|ipod/i.test(ua), isAndroid=/android/i.test(ua);
  var isLine=/\bLine\//i.test(ua);
  var isSafari=/safari/i.test(ua)&&!/crios|fxios|chrome|edg/i.test(ua);
  var bar=document.getElementById('installBar'), btn=document.getElementById('installBtn'), hint=document.getElementById('installHint');
  if('serviceWorker' in navigator){var _rl=false;navigator.serviceWorker.addEventListener('controllerchange',function(){if(_rl)return;_rl=true;window.location.reload();});navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(reg){reg.update();setInterval(function(){reg.update();},60000);}).catch(function(){});}
  var dp=null;
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;bar.style.display='block';btn.style.display='block';});
  btn.addEventListener('click',function(){if(!dp)return;dp.prompt();dp.userChoice.then(function(){dp=null;btn.style.display='none';});});
  var msg='';
  if(standalone){bar.style.display='none';}
  else if(isLine){msg='<b>เปิดในเบราว์เซอร์ก่อน</b><br>กดเมนู ⋯ มุมขวาบน → “เปิดด้วยเบราว์เซอร์อื่น” (Safari/Chrome) แล้วค่อยติดตั้ง';bar.style.display='block';}
  else if(isIOS){msg=isSafari?'<b>ติดตั้งบน iPhone:</b><br>1. กดปุ่ม แชร์ (สี่เหลี่ยมมีลูกศรขึ้น)<br>2. เลือก “เพิ่มไปยังหน้าจอเริ่มต้น”':'<b>iPhone ต้องใช้ Safari</b><br>ก็อปลิงก์นี้ไปเปิดใน Safari แล้วเพิ่มลงหน้าจอโฮม';bar.style.display='block';}
  else if(isAndroid){msg='<b>ติดตั้งบน Android:</b> รอปุ่มเหลือง “ติดตั้งแอป” สักครู่แล้วกด หรือเมนู ⋮ → “เพิ่มลงในหน้าจอหลัก”';bar.style.display='block';}
  if(msg)hint.innerHTML=msg;
</script>

<script>
/* ดึงลิงก์สดจาก links.json ทุกครั้งที่เปิดหน้า — เปลี่ยนลิงก์แค่แก้ links.json ไม่ต้องแตะไฟล์นี้
   (ถ้าดึงไม่ได้ เช่น ออฟไลน์ ใช้ลิงก์ที่ฝังไว้ใน href เดิมเป็น fallback) */
(function(){
  var MAP={scan:'.scanbtn',hr:'.c-hr',fix:'.c-fix',car:'.c-car',maid:'.c-maid',risk:'.c-risk',sign:'.c-sign'};
  fetch('links.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(links){
    Object.keys(MAP).forEach(function(k){
      if(!links[k])return;
      document.querySelectorAll('a'+MAP[k]).forEach(function(a){a.href=links[k];});
    });
  }).catch(function(){});
})();
</script>

</div>
</body>
</html>
