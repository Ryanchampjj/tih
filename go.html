<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>กำลังเปิดระบบ — TIH</title>
<meta name="theme-color" content="#2B4CA0">
<link rel="icon" type="image/png" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--blue:#2B4CA0;--bg:#AACCD6;--card:#FFFFFF;--text:#1F2A44;--muted:#6B7385;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Sarabun',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{background:var(--card);border-radius:16px;box-shadow:0 12px 26px rgba(0,0,0,.18);
        padding:30px 24px;max-width:400px;width:100%;text-align:center;position:relative;}
  .spin{width:38px;height:38px;margin:0 auto 18px;border:4px solid #dfe4ee;border-top-color:var(--blue);
        border-radius:50%;animation:sp .8s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  h1{font-size:19px;font-weight:700;color:var(--blue);margin-bottom:6px;}
  p{font-size:14px;color:var(--muted);line-height:1.6;}
  .btn{display:none;margin-top:20px;width:100%;padding:15px;border-radius:12px;background:var(--blue);
       color:#fff;font-size:16px;font-weight:600;text-decoration:none;}
  .btn.show{display:block;}
  .alt{display:none;margin-top:14px;font-size:13.5px;color:var(--muted);}
  .alt.show{display:block;}
  .alt a{color:var(--blue);font-weight:600;}
  .back{display:block;margin-top:18px;font-size:13.5px;color:var(--muted);text-decoration:none;}
  .ver{position:absolute;right:12px;bottom:8px;font-size:11px;color:#c3cad6;}
</style>
</head>
<body>
<div class="card">
  <div class="spin" id="spin"></div>
  <h1 id="ttl">กำลังเปิดระบบ</h1>
  <p id="msg">รอสักครู่</p>
  <a class="btn" id="go" href="./">เปิดระบบ</a>
  <div class="alt" id="alt">ยังไม่เปิด? <a id="alt2" href="./">ลองอีกวิธี</a></div>
  <a class="back" href="./">กลับหน้าเมนู</a>
  <div class="ver">v17</div>
</div>

<script>
/* ===== หน้ากลางก่อนเข้าแอปในเมนู =====
   ปัญหาที่แก้: บนมือถือ Android ถ้ากดลิงก์ script.google.com ตรงๆ ระบบจะโยนลิงก์
   ไปให้แอป Google Drive เปิด แล้วขึ้น "Page Not Found" — เกิดกับทุกการ์ด Apps Script
   (พิสูจน์แล้วว่าไม่เกี่ยวกับความยาวตั๋ว และไม่หายแม้เด้งต่อด้วยสคริปต์ในหน้านี้)

   วิธีแก้ที่ใช้ตอนนี้: เด้งไปที่ประตูฝั่งเซิร์ฟเวอร์ tih-hub /api/goto ก่อน
   แล้วเซิร์ฟเวอร์ตอบ 302 ต่อไปยังระบบปลายทาง — Android ไม่เอา redirect ของ
   เซิร์ฟเวอร์ไปให้แอปอื่นเปิด ตั๋ว SSO แนบไปกับลิงก์นั้นด้วย
   ทางสำรอง: บน Android มีลิงก์แบบ intent (สั่งให้ Chrome เปิด) ให้กดเอง */
(function(){
  var TK='tih_sso';
  var GATE='https://tih-hub.vercel.app/api/goto';   /* ประตูเด้งฝั่งเซิร์ฟเวอร์ */

  /* ลิงก์ตรง ใช้เป็นทางสำรอง (ตัวจริงอยู่ที่ links.json / ฝั่งเซิร์ฟเวอร์) */
  var DIRECT={
    hr:'https://script.google.com/macros/s/AKfycbwshwpfmuG9FDqbxpmn3iwxoT-JiHSXtRf16pJVjnKJy7fpMjh1TXfp4lm09hMnowtT/exec',
    fix:'https://tihkpn.vercel.app/repair.html',
    car:'https://script.google.com/macros/s/AKfycbyeeGoVjCFsqno3gh3TKphiD7X18cSa7OOh7Gu8EIMCCJw54LkpD0_jiZJvK_59I2uN/exec',
    maid:'https://script.google.com/macros/s/AKfycbxZ0PviqiCfoAoRqKoHaGzsvDnOAG96C2gY6hcUq_sNU8fVNX60eFLGnwvL7MEdJf0R2Q/exec',
    risk:'https://incident-report-one.vercel.app/',
    cheer:'https://incident-report-one.vercel.app/compliment.html',
    sign:'https://incident-report-one.vercel.app/sign.html'
  };
  var NAME={hr:'ระบบงาน HR',fix:'แจ้งซ่อม',car:'แจ้งขอใช้รถ',maid:'แจ้งขอรับบริการแม่บ้าน',
            risk:'แจ้งความเสี่ยง',cheer:'แจ้งชื่นชม',sign:'ส่งเอกสารให้ ผอ. เซ็น'};

  var $=function(id){ return document.getElementById(id); };
  var isAndroid=/android/i.test(navigator.userAgent||'');

  var key=(location.search.match(/[?&]a=([a-z]+)/)||[])[1]||'';
  /* รับเฉพาะชื่อระบบที่รู้จัก — กันคนยัด URL อื่นมาเปิดผ่านหน้านี้ */
  if(!DIRECT[key]){ location.replace('./'); return; }
  $('msg').textContent='กำลังเปิด '+NAME[key];

  var t=''; try{ t=localStorage.getItem(TK)||''; }catch(e){}

  /* ทางหลัก: ประตูฝั่งเซิร์ฟเวอร์ (เซิร์ฟเวอร์เป็นคนเด้งต่อ) */
  var gateUrl=GATE+'?a='+encodeURIComponent(key)+(t?'&tk='+encodeURIComponent(t):'');

  /* ทางสำรอง: ลิงก์ตรง — บน Android ใช้แบบ intent สั่งให้ Chrome เปิด
     (เครื่องที่ไม่มี Chrome จะตกไปใช้ลิงก์ https ปกติเอง) */
  var direct=DIRECT[key]+(t?(DIRECT[key].indexOf('?')<0?'?':'&')+'tk='+encodeURIComponent(t):'');
  /* เครื่องที่ล็อกอิน Google หลายบัญชี Google จะพาไป /u/1/macros/... ซึ่ง Apps Script
     ไม่รองรับ แล้วขึ้น "Page Not Found" — ปักบัญชีแรกไว้กันเด้ง */
  if(direct.indexOf('script.google.com')>-1) direct+=(direct.indexOf('?')<0?'?':'&')+'authuser=0';
  var altUrl=isAndroid
    ? 'intent://'+direct.replace(/^https?:\/\//,'')+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(direct)+';end'
    : direct;

  $('go').href=gateUrl;
  $('alt2').href=altUrl;

  /* ถ้าเปิดอัตโนมัติไม่สำเร็จใน 2 วินาที ให้ผู้ใช้กดเอง (การกดเองมักผ่าน) */
  setTimeout(function(){
    $('spin').style.display='none';
    $('ttl').textContent='กดเพื่อเปิด';
    $('msg').textContent=NAME[key];
    $('go').classList.add('show');
    $('alt').classList.add('show');
  },2000);

  location.href=gateUrl;
})();
</script>
</body>
</html>
