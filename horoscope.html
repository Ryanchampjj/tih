<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ดวงรายวัน — ระบบงาน TIH</title>
<meta name="theme-color" content="#2E4A7D">
<link rel="icon" type="image/png" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* พาเลตจากรูปการ์ด taro: ฟ้าอ่อน · กรมท่า · ทอง · ขาว */
  :root{
    --bg:#C9E4FA;--bg2:#B5D9F7;--navy:#2E4A7D;--navy2:#23395F;--gold:#D9A93A;--card:#FFFFFF;
    --text:#1F2F4D;--muted:#4A5B78;--line:#DCE8F5;--chip:#EAF4FD;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Sarabun',system-ui,sans-serif;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh;padding:20px 16px 40px;}
  .wrap{max-width:720px;margin:0 auto;}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .back{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--navy);text-decoration:none;font-weight:600;font-size:15px;padding:9px 14px;border-radius:11px;box-shadow:0 4px 10px rgba(46,74,125,.15);}
  .back svg{width:18px;height:18px;}
  h1{font-size:30px;font-weight:700;color:var(--navy);line-height:1.2;}
  .date{font-size:16px;color:var(--muted);font-weight:500;margin-top:2px;}
  .pay{display:flex;gap:12px;align-items:flex-start;background:#FFF4D6;border:2px solid var(--gold);border-radius:16px;padding:14px 16px;margin:14px 0 4px;box-shadow:0 6px 16px rgba(217,169,58,.25);}
  .pay svg{flex-shrink:0;width:40px;height:40px;}
  .pay h2{font-size:19px;color:#7A5200;margin-bottom:3px;}
  .pay p{font-size:16px;line-height:1.65;color:#4A3A12;}
  .note{background:#FFF7E0;border:1.5px solid #E9C766;color:#6A4B00;border-radius:12px;padding:11px 14px;font-size:14.5px;margin:12px 0;}
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:16px 0;}
  .day{border:2px solid transparent;background:#fff;color:var(--navy);border-radius:12px;padding:9px 2px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;text-align:center;line-height:1.25;}
  .day small{display:block;font-size:11.5px;font-weight:500;color:var(--muted);}
  .day.on{background:var(--navy);color:#fff;border-color:var(--navy);}
  .day.on small{color:#D5E2F5;}
  .day.mine:not(.on){border-color:var(--gold);}
  .card{background:var(--card);border-radius:18px;box-shadow:0 10px 24px rgba(46,74,125,.16);padding:20px 18px;margin-bottom:14px;}
  .who{font-size:14px;font-weight:600;color:var(--gold);letter-spacing:.2px;}
  .title{font-size:24px;font-weight:700;color:var(--navy);margin:2px 0 6px;}
  .stars{display:flex;gap:3px;margin-bottom:12px;}
  .stars svg{width:22px;height:22px;}
  .overall{font-size:17px;line-height:1.75;}
  .taksa{display:inline-block;background:var(--chip);color:var(--navy);font-size:14px;font-weight:600;border-radius:9px;padding:6px 11px;margin-bottom:12px;}
  .sec{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line);}
  .sec:first-of-type{border-top:0;}
  .ico{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--chip);display:flex;align-items:center;justify-content:center;}
  .ico svg{width:22px;height:22px;stroke:var(--navy);}
  .sec h3{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:2px;}
  .sec p{font-size:16px;line-height:1.65;color:var(--text);}
  .lucky{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .lucky .wide{grid-column:1/-1;}
  .lk.avoid{background:#FDECEC;}
  .lk .warn{display:block;font-style:normal;font-size:13px;color:var(--muted);margin-top:4px;line-height:1.4;}
  .howto{font-size:15px;color:var(--muted);line-height:1.6;margin:4px 0 8px;}
  .bhumi{padding:11px 12px;border-top:1px solid var(--line);}
  .bhumi b{font-size:16px;color:var(--navy);}
  .bhumi p{font-size:15px;line-height:1.6;color:var(--text);margin-top:2px;}
  .bhumi.on{background:var(--chip);border-radius:12px;border-top-color:transparent;}
  .bhumi.on + .bhumi{border-top-color:transparent;}
  .today{display:inline-block;background:var(--navy);color:#fff;font-size:12px;font-weight:600;border-radius:7px;padding:2px 8px;margin-left:6px;vertical-align:2px;}
  .lk.avoid b{color:#9B1C1C;}
  .lk{background:var(--chip);border-radius:12px;padding:12px 14px;}
  .lk span{display:block;font-size:13.5px;color:var(--muted);font-weight:600;}
  .lk b{font-size:18px;color:var(--navy);}
  .ask{text-align:center;}
  .ask p{font-size:16px;color:var(--muted);margin-top:4px;}
  footer{text-align:center;font-size:13.5px;color:var(--muted);margin-top:18px;line-height:1.6;}
  .empty{text-align:center;font-size:16px;color:var(--muted);padding:26px 8px;}
  @media (max-width:420px){.day{font-size:13px;}.day small{font-size:10.5px;}h1{font-size:26px;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>พอร์ทัล</a>
  </div>
  <h1>ดวงรายวัน</h1>
  <div class="date" id="dateLine">กำลังโหลด…</div>
  <div class="note" id="note" hidden></div>
  <div class="pay" id="pay" hidden></div>

  <div class="days" id="days"></div>
  <div id="main"></div>

  <footer>คำนวณตามหลักทักษาพยากรณ์ (ดาวประจำวันเกิด) · เพื่อความบันเทิงและกำลังใจ · อัปเดตทุกวันเวลา 00:01 น.</footer>
</div>

<script>
(function(){
  var AUTH='https://attendance-live-thaiinter.vercel.app';
  var DAYS=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
  var SHORT=['อา','จ','อ','พ','พฤ','ศ','ส'];
  var KEY_SEL='horo_sel', KEY_MINE='horo_mine';
  var ICONS={
    work:'<path d="M3 7h18v12H3z"/><path d="M8 7V5h8v2"/><path d="M3 12h18"/>',
    money:'<circle cx="12" cy="12" r="8"/><path d="M12 7v10"/><path d="M15 9.5c-.6-.9-1.7-1.5-3-1.5-1.7 0-3 .9-3 2s1.3 2 3 2 3 .9 3 2-1.3 2-3 2c-1.3 0-2.4-.6-3-1.5"/>',
    love:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
    health:'<path d="M3 12h4l2-5 4 10 2-5h6"/>'
  };
  var SECS=[['work','การงาน'],['money','การเงิน'],['love','ความรัก'],['health','สุขภาพ']];
  /* ความหมาย 8 ภูมิของทักษา (ตรงกับ horoscope/plan.js) */
  var TAKSA={'บริวาร':'คนรอบตัว','อายุ':'สุขภาพและความสบายใจ','เดช':'อำนาจและความมั่นใจ','ศรี':'โชคลาภ','มูละ':'ทรัพย์สินและรากฐาน','อุตสาหะ':'ความขยัน','มนตรี':'ผู้ใหญ่อุปถัมภ์','กาลกิณี':'อุปสรรค ควรระวัง'};
  /* คำอธิบายเต็มของ 8 ภูมิ เรียงตามวงทักษา (บริวาร → กาลกิณี) */
  var TAKSA_FULL=[
    ['บริวาร','คนรอบตัว ครอบครัว คู่ครอง เพื่อนร่วมงาน และลูกน้อง วันที่ดาวเข้าภูมินี้ เรื่องคนและการทำงานเป็นทีมจะเด่น'],
    ['อายุ','สุขภาพ ความเป็นอยู่ และความสบายกายสบายใจ เป็นวันที่ควรดูแลตัวเองและพักผ่อนให้พอ'],
    ['เดช','อำนาจ ชื่อเสียง ความน่าเชื่อถือ และความกล้าตัดสินใจ พูดอะไรคนฟัง เหมาะกับการเป็นผู้นำ'],
    ['ศรี','โชคลาภ เงินทอง เสน่ห์ และสิ่งดี ๆ ที่เข้ามา ถือเป็นภูมิที่ดีที่สุดภูมิหนึ่ง'],
    ['มูละ','ทรัพย์สิน บ้าน ที่ดิน การเก็บออม และรากฐานของชีวิต เหมาะกับการวางแผนระยะยาว'],
    ['อุตสาหะ','ความขยัน การงาน และความพยายาม วันนี้ต้องลงแรงมาก แต่ผลที่ได้จะคุ้มค่า'],
    ['มนตรี','ผู้ใหญ่อุปถัมภ์ ที่ปรึกษา และคนที่คอยช่วยเหลือ ขอความช่วยเหลือวันนี้มักได้ผลดี'],
    ['กาลกิณี','อุปสรรค ความขัดข้อง และสิ่งที่ควรหลีกเลี่ยง วันนี้ให้ใจเย็น รอบคอบ เลื่อนเรื่องสำคัญได้ก็เลื่อน']
  ];

  /* กิมมิควันรับทรัพย์ (พี่สั่ง 26/09/2569): วันสุดท้ายของเดือน = เงินเดือนออก · วันที่ 10 = ค่าโอทีออก
     เลือกประโยคตามวันที่ ทุกคนเห็นประโยคเดียวกันทั้งวัน */
  var PAY_SALARY=[
    'ดาวทุกดวงพร้อมใจกันเข้าภูมิศรีหนึ่งวัน นักโหราศาสตร์เรียกว่า "วันเงินเดือนออก" เปิดแอปธนาคารดูได้เลย ไม่ต้องรอดูดาว',
    'วันนี้ดวงการเงินได้ 5 ดาวทุกวันเกิด ส่วนจะอยู่ถึงวันที่ 5 ไหม ขึ้นกับของในตะกร้าแอปช้อปปิ้ง ดวงช่วยไม่ได้',
    'วันรับทรัพย์ประจำเดือนมาถึงแล้ว ใครคิดจะเลี้ยงข้าวเพื่อน วันนี้ฤกษ์ดีที่สุด (ดีสำหรับเพื่อน)',
    'โชคลาภเข้าบัญชีแบบไม่ต้องลุ้น ไม่ต้องขูด ไม่ต้องเขย่าเซียมซี แค่ทำงานมาครบเดือนก็พอ',
    'ทักษาวันนี้ไม่ต้องคำนวณ ทุกคนได้ภูมิศรีเท่ากันหมด เงินเดือนออกแล้ว ขอให้ใช้อย่างมีสติ อย่างน้อยถึงกลางเดือน'
  ];
  var PAY_OT=[
    'ค่าโอทีออกวันนี้ ชั่วโมงที่อดนอนเฝ้าเวรเปลี่ยนเป็นตัวเลขในบัญชีแล้ว ขอให้ตัวเลขใจดีกับทุกคน',
    'ภูมิอุตสาหะส่งผลวันนี้ เหนื่อยเมื่อเดือนก่อน ได้ชื่นใจวันนี้ ใครขึ้นเวรเยอะ วันนี้ยิ้มกว้างสุดในแผนก',
    'วันรับทรัพย์รอบสองของเดือน ค่าโอทีมาแล้ว ถือเป็นโชคลาภจากความขยันล้วน ๆ ไม่ต้องพึ่งเลขมงคล',
    'ดวงวันนี้เข้าข้างคนขยัน ค่าโอทีเข้าแล้ว ส่วนคนที่แลกโอทีเป็นวันหยุดไว้ ก็ได้นอนยาวแทน ไม่เสียเปรียบกัน',
    'ค่าโอทีออกแล้ว ใครสัญญากับตัวเองไว้ว่าจะซื้อของรางวัลให้ตัวเอง วันนี้ทำตามสัญญาได้ (พอประมาณ)'
  ];
  function paydayOf(iso){
    var d=new Date(iso+'T00:00:00Z'), day=d.getUTCDate();
    var last=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();
    var n=Math.floor(d.getTime()/86400000);
    if(day===last) return {title:'วันนี้รับทรัพย์ เงินเดือนออก',text:PAY_SALARY[n%PAY_SALARY.length]};
    if(day===10) return {title:'วันนี้รับทรัพย์ ค่าโอทีออก',text:PAY_OT[n%PAY_OT.length]};
    return null;
  }

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  function todayBkk(){return new Date(Date.now()+7*3600*1000).toISOString().slice(0,10);}
  var MONTHS=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  function thaiDate(iso){var d=new Date(iso+'T00:00:00Z');return 'วัน'+DAYS[d.getUTCDay()]+'ที่ '+d.getUTCDate()+' '+MONTHS[d.getUTCMonth()]+' '+(d.getUTCFullYear()+543);}
  function star(on){return '<svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z" fill="'+(on?'#D9A93A':'#E3ECF6')+'" stroke="'+(on?'#B8871F':'#C9D7E6')+'" stroke-width="1.2" stroke-linejoin="round"/></svg>';}

  var DATA=null, MINE=null, SEL=null;
  var saved=lsGet(KEY_MINE); if(saved!==null&&saved!==''&&!isNaN(+saved))MINE=+saved;
  var ss=lsGet(KEY_SEL); if(ss!==null&&ss!==''&&!isNaN(+ss))SEL=+ss;

  function renderDays(){
    document.getElementById('days').innerHTML=DAYS.map(function(n,i){
      return '<button class="day'+(i===SEL?' on':'')+(i===MINE?' mine':'')+'" data-i="'+i+'">'+SHORT[i]+'<small>'+(i===MINE?'วันเกิด':'&nbsp;')+'</small></button>';
    }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('.day'),function(b){
      b.addEventListener('click',function(){SEL=+b.getAttribute('data-i');lsSet(KEY_SEL,String(SEL));
        if(MINE===null){MINE=SEL;lsSet(KEY_MINE,String(MINE));}   /* ยังไม่รู้วันเกิด (ไม่ได้ล็อกอิน/ทะเบียนไม่มี) → แตะครั้งแรก = วันเกิดของคุณ */
        renderDays();renderMain();});
    });
  }

  function renderMain(){
    var m=document.getElementById('main');
    if(!DATA){m.innerHTML='<div class="card empty">ยังโหลดดวงไม่ได้ ลองรีเฟรชอีกครั้ง</div>';return;}
    if(SEL===null){
      m.innerHTML='<div class="card ask"><div class="title">คุณเกิดวันอะไร</div><p>แตะวันเกิดของคุณด้านบน ระบบจะจำไว้ให้ครั้งต่อไป</p></div>';
      return;
    }
    var d=(DATA.days||[])[SEL];
    if(!d){m.innerHTML='<div class="card empty">ไม่มีดวงของวันนี้</div>';return;}
    var sc=Math.max(0,Math.min(5,+d.stars||0)), st='';
    for(var i=1;i<=5;i++)st+=star(i<=sc);
    var h='<div class="card">'+
      '<div class="who">'+(SEL===MINE?'ดวงของคุณ · ':'')+'คนเกิดวัน'+DAYS[SEL]+'</div>'+
      '<div class="title">'+esc(d.headline||'')+'</div>'+
      '<div class="stars" aria-label="ดวงวันนี้ '+sc+' จาก 5">'+st+'</div>'+
      (d.taksa?'<div class="taksa">ทักษาวันนี้: ดาว'+esc(DATA.todayPlanet||'')+'เข้าภูมิ'+esc(d.taksa)+' — '+esc(TAKSA[d.taksa]||'')+'</div>':'')+
      '<div class="overall">'+esc(d.overall||'')+'</div></div>';
    h+='<div class="card">'+SECS.map(function(s){
      return '<div class="sec"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+ICONS[s[0]]+'</svg></div>'+
        '<div><h3>'+s[1]+'</h3><p>'+esc(d[s[0]]||'')+'</p></div></div>';
    }).join('')+'</div>';
    h+='<div class="card lucky">'+
      '<div class="lk"><span>สีเสริมโชคลาภ</span><b>'+esc(d.luckyColor||'')+'</b></div>'+
      (d.powerColor?'<div class="lk"><span>สีเสริมความมั่นใจ</span><b>'+esc(d.powerColor)+'</b></div>':'')+
      (d.supportColor?'<div class="lk"><span>สีเสริมผู้อุปถัมภ์</span><b>'+esc(d.supportColor)+'</b></div>':'')+
      (d.avoidColor?'<div class="lk avoid"><span>สีที่ควรเลี่ยง (กาลกิณี)</span><b>'+esc(d.avoidColor)+'</b></div>':'')+
      '<div class="lk"><span>เลขมงคล</span><b>'+esc(d.luckyNumber||'')+'</b><em class="warn">เล่นมากเสียมาก เล่นน้อยเสียน้อย</em></div>'+
      (d.tip?'<div class="lk'+(d.powerColor?'':' wide')+'"><span>ข้อแนะนำวันนี้</span><b style="font-size:16px">'+esc(d.tip)+'</b></div>':'')+
      '</div>';
    h+='<div class="card"><div class="title" style="font-size:20px">ภูมิทั้ง 8 ในทักษา</div>'+
      '<p class="howto">เริ่มจากดาวประจำวันเกิดของคุณเป็น "บริวาร" แล้วนับวนตามวงทักษา ดาวของวันนี้ไปตกภูมิไหน เรื่องของภูมินั้นจะเด่นในวันนี้</p>'+
      TAKSA_FULL.map(function(t){var on=(t[0]===d.taksa);
        return '<div class="bhumi'+(on?' on':'')+'"><b>'+esc(t[0])+(on?' <span class="today">วันนี้</span>':'')+'</b><p>'+esc(t[1])+'</p></div>';}).join('')+
      '</div>';
    m.innerHTML=h;
  }

  function loadData(){
    fetch('horoscope/today.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){
      DATA=j;
      document.getElementById('dateLine').textContent='ดวงประจำ'+thaiDate(j.date);
      var n=document.getElementById('note');
      if(j.date!==todayBkk()){n.hidden=false;n.textContent='ดวงของวันนี้ยังไม่ขึ้น กำลังแสดงดวงของ'+thaiDate(j.date);}
      var pd=paydayOf(j.date), pe=document.getElementById('pay');
      if(pd){pe.hidden=false;pe.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="#B8871F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v4c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 10v4c0 1.7 3.1 3 7 3s7-1.3 7-3v-4"/><path d="M5 14v4c0 1.7 3.1 3 7 3s7-1.3 7-3v-4"/></svg><div><h2>'+esc(pd.title)+'</h2><p>'+esc(pd.text)+'</p></div>';}
      else pe.hidden=true;
      renderMain();
    }).catch(function(){document.getElementById('dateLine').textContent='';renderMain();});
  }

  /* วันเกิดจากทะเบียนพนักงาน (ล็อกอินพอร์ทัลอยู่) — ได้แค่ "วันในสัปดาห์" ไม่ได้วันเดือนปีเกิด */
  function loadMine(){
    var t=lsGet('tih_sso'); if(!t)return;
    fetch(AUTH+'/api/verifypin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'bday',token:t})})
      .then(function(r){return r.json();}).then(function(d){
        if(!d||!d.ok||d.dow===null||d.dow===undefined)return;
        MINE=+d.dow; lsSet(KEY_MINE,String(MINE));
        if(SEL===null)SEL=MINE;
        renderDays();renderMain();
      }).catch(function(){});
  }

  if(SEL===null&&MINE!==null)SEL=MINE;
  renderDays(); loadData(); loadMine();
})();
</script>
