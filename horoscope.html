<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ดวงของฉัน — ระบบงาน TIH</title>
<meta name="theme-color" content="#2E4A7D">
<link rel="icon" type="image/png" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Srisakdi:wght@700&family=Taviraj:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* พาเลตจากรูปการ์ด taro: ฟ้าอ่อน · กรมท่า · ทอง · ขาว */
  :root{
    --bg:#C9E4FA;--bg2:#B5D9F7;--navy:#2E4A7D;--navy2:#23395F;--gold:#D9A93A;--card:#FFFFFF;
    --text:#1F2F4D;--muted:#4A5B78;--line:#DCE8F5;--chip:#EAF4FD;
    --good:#FFF4D6;--goodt:#7A5200;--bad:#FDECEC;--badt:#9B1C1C;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  [hidden]{display:none!important;}   /* .pay ตั้ง display:flex ไว้ ทำให้ hidden ไม่ซ่อน — แถบทองว่างโผล่ทุกวันที่ไม่ใช่วันรับทรัพย์ */
  body{font-family:'Sarabun',system-ui,sans-serif;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh;padding:20px 16px 40px;}
  .wrap{max-width:720px;margin:0 auto;}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .back{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--navy);text-decoration:none;font-weight:600;font-size:15px;padding:9px 14px;border-radius:11px;box-shadow:0 4px 10px rgba(46,74,125,.15);}
  .back svg{width:18px;height:18px;}
  h1{font-size:30px;font-weight:700;color:var(--navy);line-height:1.2;}
  .date{font-size:16px;color:var(--muted);font-weight:500;margin-top:2px;}
  .pay{display:flex;gap:12px;align-items:flex-start;background:var(--good);border:2px solid var(--gold);border-radius:16px;padding:14px 16px;margin:14px 0 4px;box-shadow:0 6px 16px rgba(217,169,58,.25);}
  .pay svg{flex-shrink:0;width:40px;height:40px;}
  .pay h2{font-size:19px;color:var(--goodt);margin-bottom:3px;}
  .pay p{font-size:16px;line-height:1.65;color:#4A3A12;}
  .note{background:#FFF7E0;border:1.5px solid #E9C766;color:#6A4B00;border-radius:12px;padding:11px 14px;font-size:14.5px;margin:12px 0;}
  .sech{font-size:21px;font-weight:700;color:var(--navy2);margin:24px 2px 10px;display:flex;align-items:center;gap:10px;}
  .sech::after{content:"";flex:1;height:2px;background:rgba(46,74,125,.18);border-radius:2px;}
  .card{background:var(--card);border-radius:18px;box-shadow:0 10px 24px rgba(46,74,125,.16);padding:20px 18px;margin-bottom:14px;}
  .who{font-size:14px;font-weight:600;color:var(--gold);letter-spacing:.2px;}
  .title{font-size:24px;font-weight:700;color:var(--navy);margin:2px 0 6px;line-height:1.35;}
  .stars{display:flex;gap:3px;margin-bottom:12px;}
  .stars svg{width:22px;height:22px;}
  .overall{font-size:17px;line-height:1.75;}
  .taksa{display:inline-block;background:var(--chip);color:var(--navy);font-size:14px;font-weight:600;border-radius:9px;padding:6px 11px;margin-bottom:12px;}
  .sec{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line);}
  .sec:first-of-type{border-top:0;}
  .ico{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--chip);display:flex;align-items:center;justify-content:center;}
  .ico svg{width:22px;height:22px;stroke:var(--navy);}
  .sec h3{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:2px;}
  .sec p{font-size:16px;line-height:1.65;color:var(--text);}
  .lucky{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .lucky .wide{grid-column:1/-1;}
  .lk{background:var(--chip);border-radius:12px;padding:12px 14px;}
  .lk span{display:block;font-size:13.5px;color:var(--muted);font-weight:600;}
  .lk b{font-size:18px;color:var(--navy);}
  .lk.avoid{background:var(--bad);}
  .lk.avoid b{color:var(--badt);}
  .lk .warn{display:block;font-style:normal;font-size:13px;color:var(--muted);margin-top:4px;line-height:1.4;}
  .howto{font-size:15px;color:var(--muted);line-height:1.6;margin:4px 0 8px;}
  .bhumi{padding:11px 12px;border-top:1px solid var(--line);}
  .bhumi b{font-size:16px;color:var(--navy);}
  .bhumi p{font-size:15px;line-height:1.6;color:var(--text);margin-top:2px;}
  .bhumi.on{background:var(--chip);border-radius:12px;border-top-color:transparent;}
  .bhumi.on + .bhumi{border-top-color:transparent;}
  .today{display:inline-block;background:var(--navy);color:#fff;font-size:12px;font-weight:600;border-radius:7px;padding:2px 8px;margin-left:6px;vertical-align:2px;}
  footer{text-align:center;font-size:13.5px;color:var(--muted);margin-top:18px;line-height:1.6;}
  .empty{text-align:center;font-size:16px;color:var(--muted);padding:26px 8px;}

  /* ข้อมูลเกิด */
  .pf{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;}
  .pf .txt{flex:1 1 260px;min-width:0;}
  .pf .big{font-size:18px;font-weight:700;color:var(--navy);line-height:1.5;}
  .pf .sub{font-size:15px;color:var(--muted);line-height:1.6;margin-top:2px;}
  .btn{font-family:inherit;font-size:15px;font-weight:700;border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:11px;padding:9px 15px;cursor:pointer;}
  .btn.pri{background:var(--navy);color:#fff;}
  .btn:disabled{opacity:.55;cursor:default;}
  .lnk{font:inherit;font-weight:700;color:var(--navy);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
  .form h2{font-size:20px;color:var(--navy);margin-bottom:4px;}
  .form .lbl{display:block;font-size:15px;font-weight:700;color:var(--navy);margin:14px 0 6px;}
  .form .lbl small{font-weight:600;color:var(--muted);font-size:13.5px;}
  .row3{display:grid;grid-template-columns:1fr 1.6fr 1.3fr;gap:8px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:320px;}
  select{font-family:inherit;font-size:16px;padding:10px 10px;border:1.5px solid #C4D6EA;border-radius:10px;background:#fff;color:var(--text);width:100%;}
  .locked{font-size:17px;font-weight:600;color:var(--text);background:var(--chip);border-radius:10px;padding:10px 12px;}
  .locked small{display:block;font-size:13px;font-weight:500;color:var(--muted);}
  .hint{background:var(--good);border-left:4px solid var(--gold);border-radius:10px;padding:10px 12px;font-size:14.5px;line-height:1.6;color:#4A3A12;margin-top:10px;}
  .acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px;}
  .msg{font-size:14.5px;font-weight:600;}
  .msg.ok{color:#1F6B3A;}.msg.err{color:var(--badt);}

  /* ป้ายความสัมพันธ์ ดี / ระวัง / กลาง */
  .rel{display:inline-block;font-size:14px;font-weight:700;border-radius:9px;padding:4px 11px;margin:2px 0 8px;}
  .rel.good{background:var(--good);color:var(--goodt);border:1.5px solid #E9C766;}
  .rel.bad{background:var(--bad);color:var(--badt);border:1.5px solid #F3C4C4;}
  .rel.mid{background:var(--chip);color:var(--navy);border:1.5px solid #C4D6EA;}
  .blk{padding:14px 0;border-top:1px solid var(--line);}
  .blk:first-child,.who + .blk{border-top:0;padding-top:0;}
  .who + .blk{margin-top:6px;}
  .blk:last-child{padding-bottom:0;}
  .blk h3{font-size:15px;font-weight:700;color:var(--muted);margin-bottom:2px;}
  .blk .v{font-size:21px;font-weight:700;color:var(--navy);line-height:1.4;}
  .blk .v small{font-size:15px;font-weight:600;color:var(--muted);}
  .blk p{font-size:16px;line-height:1.7;margin-top:4px;}
  .blk .fine{font-size:14px;color:var(--muted);line-height:1.55;margin-top:6px;}
  .num{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:var(--navy);color:#fff;font-size:22px;font-weight:700;margin-right:10px;vertical-align:middle;}

  /* มหาทักษา — ช่วงชีวิต 8 ช่วง */
  .dasa{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .dasa .r{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);font-size:15px;}
  .dasa .r:first-child{border-top:0;}
  .dasa .r .a{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;}
  .dasa .r .p{font-weight:700;color:var(--navy);}
  .dasa .r .p small{font-weight:500;color:var(--muted);}
  .dasa .r .s{font-size:13px;font-weight:700;border-radius:7px;padding:2px 8px;white-space:nowrap;}
  .dasa .r.past{color:#8A98AE;}
  .dasa .r.past .p{color:#8A98AE;}
  .dasa .r.now{background:var(--chip);}
  .dasa .r.now .s{background:var(--navy);color:#fff;}
  .dasa .r.next .s{background:var(--good);color:var(--goodt);}

  /* แท็บ ดวงของฉัน / กราฟชีวิต */
  .tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:#fff;border-radius:14px;padding:5px;box-shadow:0 6px 16px rgba(46,74,125,.14);}
  .tabs button{font-family:inherit;font-size:16px;font-weight:700;border:0;background:transparent;color:var(--navy);border-radius:10px;padding:11px 8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;}
  .tabs button svg{width:19px;height:19px;flex-shrink:0;}
  .tabs button.on{background:var(--navy);color:#fff;}
  .tabs + .card{margin-top:14px;}
  .t-alt #note,.t-alt #pay{display:none!important;}

  /* เซียมซี — กระบอกไม้ติ้ว + ใบเซียมซีกระดาษชมพูหมึกแดงแบบที่วัด */
  .sscard{text-align:center;}
  .sscard .title{margin-bottom:4px;}
  .ssbox{display:flex;justify-content:center;margin:20px 0 16px;}
  .ssv{width:150px;height:auto;overflow:visible;}
  .ssbox.shake .ssv{animation:ssShake .3s ease-in-out 4;transform-origin:50% 92%;}
  @keyframes ssShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-11deg)}75%{transform:rotate(11deg)}}
  .ssv .ssp{transform:translateY(64px);transition:transform .7s cubic-bezier(.2,.9,.3,1.25);}
  .ssbox.pop .ssv .ssp{transform:translateY(-6px);}
  .ssgo{display:block;width:100%;max-width:320px;margin:0 auto;font-size:17px;padding:12px 16px;}
  .slip{position:relative;max-width:440px;margin:8px auto 18px;padding:9px;border-radius:2px;
    background:linear-gradient(160deg,#FDEBE8 0%,#FBE0DC 55%,#F8D6D1 100%);color:#3F1A15;
    box-shadow:0 14px 28px rgba(90,20,20,.22),0 2px 4px rgba(90,20,20,.14);transform:rotate(-.8deg);font-family:'Taviraj','Sarabun',serif;}
  .slip.show{animation:slipIn .7s ease-out;}
  @keyframes slipIn{from{opacity:0;transform:translateY(28px) rotate(-5deg);}to{opacity:1;transform:rotate(-.8deg);}}
  .slip-in{position:relative;border:2px solid #A3191B;box-shadow:inset 0 0 0 4px #FBE3DF,inset 0 0 0 5.5px #A3191B;padding:24px 22px 18px;text-align:center;}
  .sl-c{position:absolute;width:20px;height:20px;}
  .sl-c.tl{top:9px;left:9px;}.sl-c.tr{top:9px;right:9px;transform:scaleX(-1);}
  .sl-c.bl{bottom:9px;left:9px;transform:scaleY(-1);}.sl-c.br{bottom:9px;right:9px;transform:scale(-1);}
  .sl-top{font-size:14.5px;font-weight:600;letter-spacing:.5px;color:#A3191B;}
  .sl-no{font-family:'Srisakdi','Taviraj',serif;font-weight:700;font-size:46px;line-height:1.3;color:#A3191B;margin:14px 0 4px;}
  .sl-stamp{display:inline-block;border:2.5px solid #A3191B;color:#A3191B;font-family:'Sarabun',sans-serif;font-weight:700;font-size:17px;letter-spacing:1px;padding:1px 14px;border-radius:5px;transform:rotate(-4deg);}
  .sl-orn{display:block;width:180px;max-width:80%;height:12px;margin:14px auto;}
  .sl-verse{font-size:20px;font-weight:700;line-height:1.7;color:#A3191B;}
  .sl-text{font-size:16.5px;line-height:1.8;margin:0 0 14px;}
  .sl-list{text-align:left;border-top:1px solid rgba(163,25,27,.4);padding-top:8px;margin:0;}
  .sl-list div{display:grid;grid-template-columns:88px 1fr;gap:8px;padding:6px 0;border-bottom:1px dotted rgba(163,25,27,.35);font-size:15.5px;line-height:1.65;}
  .sl-list div:last-child{border-bottom:0;}
  .sl-list dt{font-weight:700;color:#A3191B;}
  .sl-list dd{margin:0;}
  .sl-foot{margin-top:14px;font-size:13.5px;color:#7A3A33;line-height:1.6;}
  @media (prefers-reduced-motion:reduce){.slip.show,.ssbox.shake .ssv{animation:none;}.ssv .ssp{transition:none;}}

  /* กราฟชีวิต */
  .lg{margin-top:14px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:crosshair;}
  .lg svg{display:block;}
  .lg text{font-family:'Sarabun',system-ui,sans-serif;fill:var(--muted);}
  .lg .bl{font-size:11.5px;font-weight:700;fill:var(--navy);}
  .lg .yl{font-size:12px;font-weight:600;}
  .lg .xl{font-size:11.5px;font-weight:600;}
  .lgl{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--muted);font-weight:600;margin-top:8px;}
  .lgl span{display:inline-flex;align-items:center;gap:6px;}
  .lgl i{display:inline-block;width:16px;height:12px;border-radius:3px;border:1.5px solid transparent;}
  .lgl i.ln{height:0;border:0;border-top:2.5px dashed #B8871F;border-radius:0;}
  .lgi{margin-top:12px;border-top:1px solid var(--line);padding-top:12px;}
  .lgi .lgh{display:flex;align-items:center;gap:6px;}
  .lgi .lgh .rel{margin:0;}
  .lgi .lgh .today{margin-left:0;vertical-align:0;}
  .lgi .v{font-size:19px;font-weight:700;color:var(--navy);line-height:1.4;margin-top:6px;}
  .lgi .fine{font-size:14px;color:var(--muted);font-weight:600;}
  .lgi p{font-size:15.5px;line-height:1.65;margin-top:8px;}
  .lgi p b{color:var(--navy);}
  .lgn{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px;}
  .lgn .btn{padding:9px 4px;font-size:14.5px;}
  .yrs{margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .yr{display:grid;grid-template-columns:58px 1fr 66px;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);}
  .yr:first-child{border-top:0;}
  .yr.now{background:var(--chip);}
  .yr .y b{display:block;font-size:17px;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.3;}
  .yr .y small{font-size:13px;color:var(--muted);font-weight:600;}
  .yr .bar{height:10px;border-radius:6px;background:#E6EEF7;overflow:hidden;}
  .yr .bar i{display:block;height:100%;border-radius:6px;}
  .yr .yd{font-size:13.5px;color:var(--muted);line-height:1.5;margin-top:5px;}
  .yr .rel{margin:0;white-space:nowrap;justify-self:end;}
  .lv-top{background:#C8921E;}.lv-good{background:#E9C766;}.lv-mid{background:#8FA8CF;}.lv-low{background:#D46A6A;}
  @media (max-width:420px){h1{font-size:26px;}.row3{grid-template-columns:1fr 1fr;}.row3 select:last-child{grid-column:1/-1;}.dasa .r{grid-template-columns:78px 1fr auto;font-size:14px;}.yr{grid-template-columns:50px 1fr 62px;gap:8px;padding:10px;}.tabs{gap:4px;}.tabs button{font-size:15px;padding:10px 3px;gap:5px;}.tabs button svg{width:17px;height:17px;}.slip-in{padding:22px 16px 16px;}.sl-list div{grid-template-columns:80px 1fr;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>พอร์ทัล</a>
  </div>
  <h1 id="head">ดวงของคุณ</h1>
  <div class="date" id="dateLine">กำลังโหลด…</div>
  <div class="note" id="note" hidden></div>
  <div class="pay" id="pay" hidden></div>

  <div id="profile"></div>
  <div id="main"></div>

  <footer>คำนวณจากวันเดือนปีเกิด (และเวลาเกิดถ้าใส่ไว้) ด้วยทักษาพยากรณ์ มหาทักษา โหราศาสตร์ไทยแบบนิรายนะ นักษัตรจีน และเลขศาสตร์ · เซียมซีวันละ 1 ใบ<br>เพื่อความบันเทิงและกำลังใจ · ดวงรายวันอัปเดตทุกวันเวลา 00:01 น.</footer>
</div>

<script src="horoscope/astro.js"></script>
<script src="horoscope/siamsi.js"></script>
<script>
(function(){
  var AUTH='https://attendance-live-thaiinter.vercel.app';
  var A=window.ASTRO, DAYS=A.DAYS;
  var ICONS={
    work:'<path d="M3 7h18v12H3z"/><path d="M8 7V5h8v2"/><path d="M3 12h18"/>',
    money:'<circle cx="12" cy="12" r="8"/><path d="M12 7v10"/><path d="M15 9.5c-.6-.9-1.7-1.5-3-1.5-1.7 0-3 .9-3 2s1.3 2 3 2 3 .9 3 2-1.3 2-3 2c-1.3 0-2.4-.6-3-1.5"/>',
    love:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
    health:'<path d="M3 12h4l2-5 4 10 2-5h6"/>'
  };
  var SECS=[['work','การงาน'],['money','การเงิน'],['love','ความรัก'],['health','สุขภาพ']];

  /* ================= คำอธิบายประจำตัว (ไม่เปลี่ยนรายวัน) ================= */
  var TAKSA={'บริวาร':'คนรอบตัว','อายุ':'สุขภาพและความสบายใจ','เดช':'อำนาจและความมั่นใจ','ศรี':'โชคลาภ','มูละ':'ทรัพย์สินและรากฐาน','อุตสาหะ':'ความขยัน','มนตรี':'ผู้ใหญ่อุปถัมภ์','กาลกิณี':'อุปสรรค ควรระวัง'};
  var TAKSA_FULL=[
    ['บริวาร','คนรอบตัว ครอบครัว คู่ครอง เพื่อนร่วมงาน และลูกน้อง วันที่ดาวเข้าภูมินี้ เรื่องคนและการทำงานเป็นทีมจะเด่น'],
    ['อายุ','สุขภาพ ความเป็นอยู่ และความสบายกายสบายใจ เป็นวันที่ควรดูแลตัวเองและพักผ่อนให้พอ'],
    ['เดช','อำนาจ ชื่อเสียง ความน่าเชื่อถือ และความกล้าตัดสินใจ พูดอะไรคนฟัง เหมาะกับการเป็นผู้นำ'],

  function bindForm(){

  function saveForm(){
    var cur=BIRTH||{}, date=cur.src==='registry'?cur.date:'', msg=$('fMsg');
    if(!date){
      var d=$('fD').value,m=$('fM').value,y=$('fY').value;
      if(!d||!m||!y){msg.className='msg err';msg.textContent='เลือกวันที่ เดือน และปีเกิดให้ครบ';return;}
      var dt=new Date(Date.UTC(+y,+m-1,+d));
      if(dt.getUTCMonth()!==+m-1){msg.className='msg err';msg.textContent='วันที่นี้ไม่มีในเดือน'+MONTHS[+m-1];return;}
      date=y+'-'+('0'+m).slice(-2)+'-'+('0'+d).slice(-2);
    }
    var h=$('fH').value,n=$('fN').value,time='';
    if(h){time=h+':'+(n||'00');}
    var place=$('fP').value;
    if(place==='__abroad'){
      place=$('fC').value;
      if(!place){msg.className='msg err';msg.textContent='เลือกประเทศ / เมืองที่เกิดก่อน';return;}
    }
    BIRTH={date:date,time:time,place:place,src:cur.src==='registry'?'registry':'self'};
    lsSet(KEY,JSON.stringify(BIRTH));
    FORM=false; render();
    if(TK) pushServer();

  /* ================= ดวง ================= */
  /* ข้อความทักษาของวันนี้ที่ตรงกับดาววันเกิด — ใช้เฉพาะไฟล์ของ "วันนี้" เท่านั้น
     (ไฟล์ของเมื่อวานเล่าภูมิคนละภูมิ เอามาโชว์ใต้ภูมิของวันนี้จะขัดกันเอง) */
  function todayEntry(planet){
    if(!DATA||DATA.date!==TODAY||!DATA.days) return null;
    for(var i=0;i<DATA.days.length;i++){var x=DATA.days[i];if((x.planet||x.birthDay)===planet)return x;}
    return null;
  }
  function taksaCard(P){
    var d=todayEntry(P.day.planet);
    var t=P.taksa, role=t.todayRole, sc=t.stars, st='';
    for(var k=1;k<=5;k++)st+=star(k<=sc);
    var full=''; TAKSA_FULL.forEach(function(r){if(r[0]===role)full=r[1];});
    var h='<div class="card"><div class="who">ทักษาวันนี้ · คนเกิดวัน'+esc(P.day.label)+'</div>'+
      '<div class="title">'+esc(d&&d.headline?d.headline:'วันนี้ดาว'+t.todayPlanet+'เข้าภูมิ'+role+'ของคุณ')+'</div>'+
      '<div class="stars" aria-label="ดวงวันนี้ '+sc+' จาก 5">'+st+'</div>'+
      '<div class="taksa">ดาว'+esc(t.todayPlanet)+'เข้าภูมิ'+esc(role)+' — '+esc(TAKSA[role]||'')+'</div>'+
      '<div class="overall">'+esc(d&&d.overall?d.overall:full)+'</div>';
    if(d&&d.work) h+='<div style="margin-top:8px">'+SECS.map(function(s){
      return '<div class="sec"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+ICONS[s[0]]+'</svg></div>'+
        '<div><h3>'+s[1]+'</h3><p>'+esc(d[s[0]]||'')+'</p></div></div>';
    }).join('')+'</div>';
    return h+'</div>';
  }
  function dayCard(P){
    var an=A.ANIMALS, mine=P.chinese.branch, rel=P.today.rel, txt=DAY_TXT[rel];
    if(DATA&&DATA.date===TODAY&&DATA.animals&&DATA.animals[mine]&&DATA.animals[mine].text) txt=DATA.animals[mine].text;
    var nd=P.num.day, ntx=PDAY_TXT[nd];
    if(DATA&&DATA.date===TODAY&&DATA.numbers&&DATA.numbers[nd]) ntx=DATA.numbers[nd];
    return '<div class="card">'+
      '<div class="blk"><h3>วันนี้ตามปฏิทินจีน</h3><div class="v">วัน'+an[P.today.branch][0]+' <small>('+an[P.today.branch][1]+')</small></div>'+
        '<span class="rel '+relCls(rel)+'">'+esc(A.DAY_REL[rel])+' ของคนปี'+an[mine][0]+'</span><p>'+esc(txt)+'</p></div>'+
      '<div class="blk"><h3>เลขประจำวันของคุณ</h3><div class="v"><span class="num">'+nd+'</span></div><p>'+esc(ntx)+'</p>'+
        '<div class="fine">คิดจากวันและเดือนเกิด รวมกับวันที่วันนี้ ตามหลักเลขศาสตร์</div></div>'+
      '</div>';
  }
  function luckyCard(P){
    var t=P.taksa, e=todayEntry(P.day.planet), tip=e&&e.tip||'';
    return '<div class="card lucky">'+
      '<div class="lk"><span>สีเสริมโชคลาภ</span><b>'+esc(t.luckyColor)+'</b></div>'+
      '<div class="lk"><span>สีเสริมความมั่นใจ</span><b>'+esc(t.powerColor)+'</b></div>'+
      '<div class="lk"><span>สีเสริมผู้อุปถัมภ์</span><b>'+esc(t.supportColor)+'</b></div>'+
      '<div class="lk avoid"><span>สีที่ควรเลี่ยง (กาลกิณี)</span><b>'+esc(t.avoidColor)+'</b></div>'+
      '<div class="lk"><span>เลขมงคล</span><b>'+esc(t.luckyNumber)+'</b><em class="warn">เล่นมากเสียมาก เล่นน้อยเสียน้อย</em></div>'+
      (tip?'<div class="lk"><span>ข้อแนะนำวันนี้</span><b style="font-size:16px">'+esc(tip)+'</b></div>':'<div class="lk"><span>สีประจำวันเกิด</span><b>'+esc(A.COLOR[P.day.planet])+'</b></div>')+
      '</div>';
  }
  function dasaCard(P){
    var ds=P.dasa, c=ds.current, s=ds.sub, idx=ds.periods.indexOf(c);
    var rows=ds.periods.map(function(p,i){
      var cls=i<idx?'past':i===idx?'now':i===idx+1?'next':'';
      var tag=i===idx?'ตอนนี้':i===idx+1?'ถัดไป':'';
      return '<div class="r '+cls+'"><span class="a">อายุ '+Math.round(p.fromAge)+'–'+Math.round(p.toAge)+'</span>'+
        '<span class="p">'+esc(p.planet)+' <small>ภูมิ'+esc(p.role)+'</small></span>'+(tag?'<span class="s">'+tag+'</span>':'<span></span>')+'</div>';
    }).join('');
    return '<div class="card"><div class="who">มหาทักษา · ดาวเสวยอายุ</div>'+
      '<div class="title">ตอนนี้ดาว'+esc(c.planet)+'เสวยอายุ</div>'+
      '<div class="taksa">ตั้งแต่ '+shortDate(c.from)+' ถึง '+shortDate(c.to)+' (อายุ '+Math.round(c.fromAge)+'–'+Math.round(c.toAge)+' ปี)</div>'+
      '<div class="overall">'+esc(DASA_TXT[c.planet])+'</div>'+
      '<p class="howto" style="margin-top:8px">ดาว'+esc(c.planet)+esc(DASA_ROLE[c.role])+'</p>'+
      (s?'<div class="blk" style="border-top:1px solid var(--line);padding-top:12px;margin-top:10px"><h3>ดาวแทรกช่วงนี้</h3><div class="v">'+esc(s.planet)+' <small>ถึง '+shortDate(s.to)+' · ภูมิ'+esc(s.role)+'ของคุณ</small></div>'+
        '<p>'+(s.planet===c.planet
          ?'เป็นช่วงย่อยแรกของดาว'+esc(c.planet)+' ดาวเสวยแทรกตัวเอง เรื่องของภูมิ'+esc(s.role)+' ('+esc(TAKSA[s.role]||'')+') จึงเด่นเต็มที่'
          :'ภายในช่วงใหญ่ของดาว'+esc(c.planet)+' ช่วงย่อยนี้ดาว'+esc(s.planet)+'เข้ามาแทรก เรื่องของภูมิ'+esc(s.role)+' ('+esc(TAKSA[s.role]||'')+') จะเด่นเป็นพิเศษ')+'</p></div>':'')+
      '<div class="dasa">'+rows+'</div>'+
      '<p class="howto" style="margin-top:10px">ดาว 8 ดวงผลัดกันคุมช่วงชีวิต รวม 108 ปี เริ่มจากดาววันเกิด แล้วเวียนตามวงทักษา ช่วงที่ตกภูมิศรีและเดชถือเป็นช่วงรุ่งเรือง</p></div>';
  }
  function signCard(P){
    var z=P.zodiac, S=A.SIGNS, rows='';
    rows+='<div class="blk"><h3>ราศีเกิด (ตำแหน่งดวงอาทิตย์) · นิสัยพื้นฐาน</h3><div class="v">ราศี'+S[z.sun]+'</div><p>'+esc(SIGN_TXT[z.sun])+'</p></div>';
    if(z.moon!=null) rows+='<div class="blk"><h3>ราศีจันทร์ · อารมณ์และความรู้สึกข้างใน</h3><div class="v">ราศี'+S[z.moon]+'</div><p>'+esc(SIGN_TXT[z.moon])+'</p></div>';
    else rows+='<div class="blk"><h3>ราศีจันทร์ · อารมณ์และความรู้สึกข้างใน</h3><div class="v">ราศี'+S[z.moonRange[0]]+' <small>หรือ</small> ราศี'+S[z.moonRange[1]]+'</div>'+
      '<p>วันที่คุณเกิด ดวงจันทร์ย้ายราศีระหว่างวัน ต้องใช้เวลาเกิดถึงจะบอกได้ว่าอยู่ราศีไหน</p></div>';
    if(z.lagna!=null) rows+='<div class="blk"><h3>ลัคนา · ตัวตนที่คนอื่นเห็น</h3><div class="v">ลัคนาราศี'+S[z.lagna]+'</div><p>'+esc(SIGN_TXT[z.lagna])+'</p></div>';
    else rows+='<div class="blk"><h3>ลัคนา · ตัวตนที่คนอื่นเห็น</h3><p>ลัคนาต้องใช้เวลาเกิด <button type="button" class="lnk" data-addtime="1">ใส่เวลาเกิด</button> แล้วจะขึ้นตรงนี้</p></div>';
    return '<div class="card"><div class="who">ราศี · โหราศาสตร์ไทย</div>'+rows+
      '<div class="fine" style="font-size:13.5px;color:var(--muted);margin-top:12px;line-height:1.55">คิดแบบนิรายนะตามโหราศาสตร์ไทย ตำแหน่งดาวคำนวณจริงจากวันเวลาเกิด '+
        (z.place.foreign?'ลัคนาคิดตามเวลาท้องถิ่นของ'+esc(z.place.name)+' (UTC'+utcTxt(P.birth.off)+' ในปีที่เกิด) ที่พิกัดเมืองนั้น'
          :'ลัคนาคิดตามเวลาประเทศไทย ที่พิกัด'+(z.place.known?'จังหวัด'+esc(z.place.name):'กรุงเทพฯ (ยังไม่ได้เลือกที่เกิด)'))+'</div></div>';
  }
  function chineseCard(P){
    var an=A.ANIMALS, c=P.chinese, y=P.thisYear, b=P.birth;
    var early=(b.m<4||(b.m===4&&b.d<=15));

      '<div class="blk"><h3>ปีเกิดของคุณ</h3><div class="v">ปี'+an[c.branch][0]+' <small>('+an[c.branch][1]+') '+esc(ELEMENT_TXT[c.element])+'</small></div>'+
        '<p>'+esc(ANIMAL_TXT[c.branch])+'</p>'+
        (early?'<div class="fine">ปีนักษัตรแบบจีนเปลี่ยนที่วันลิบชุน (ราว 4 กุมภาพันธ์) ส่วนแบบไทยบางตำรานับถึงสงกรานต์ คนที่เกิดต้นปีจึงอาจได้ปีนักษัตรต่างจากที่เคยรู้</div>':'')+'</div>'+
      '<div class="blk"><h3>ปีนี้ ('+(y.info.year+543)+' ปี'+an[y.info.branch][0]+' ธาตุ'+y.info.element+') กับปีเกิดของคุณ</h3>'+
        '<span class="rel '+relCls(y.rel)+'">'+esc(A.YEAR_REL[y.rel])+'</span><p>'+esc(YEAR_TXT[y.rel])+'</p></div></div>';
  }
  function numCard(P){
    var n=P.num, ty=+TODAY.slice(0,4);
    return '<div class="card"><div class="who">เลขศาสตร์</div>'+
      '<div class="blk"><h3>เลขชีวิต (จากวันเดือนปีเกิด)</h3><div class="v"><span class="num">'+n.life+'</span></div><p>'+esc(LIFE_TXT[n.life])+'</p></div>'+
      '<div class="blk"><h3>เลขปี '+(ty+543)+' ของคุณ</h3><div class="v"><span class="num">'+n.year+'</span></div><p>'+esc(PYEAR_TXT[n.year])+'</p></div></div>';
  }
  function bhumiCard(P){
    var role=P.taksa.todayRole;
    return '<div class="card"><div class="title" style="font-size:20px">ภูมิทั้ง 8 ในทักษา</div>'+
      '<p class="howto">เริ่มจากดาวประจำวันเกิดของคุณ (ดาว'+esc(P.day.planet)+') เป็น "บริวาร" แล้วนับวนตามวงทักษา ดาวของวันนี้ไปตกภูมิไหน เรื่องของภูมินั้นจะเด่นในวันนี้</p>'+
      TAKSA_FULL.map(function(t){var on=(t[0]===role);var r=A.rolesOf(P.day.planet)[t[0]];
        return '<div class="bhumi'+(on?' on':'')+'"><b>'+esc(t[0])+' <small style="font-weight:600;color:var(--muted)">ดาว'+esc(r)+'</small>'+(on?' <span class="today">วันนี้</span>':'')+'</b><p>'+esc(t[1])+'</p></div>';}).join('')+
      '</div>';
  }

  /* ================= แท็บ =================
     ผูกกับ #graph — รีเฟรชแล้วอยู่แท็บเดิม · เข้าจากการ์ดพอร์ทัล (ไม่มี hash) ได้แท็บแรกเสมอ */
  var TAB={'#graph':'graph','#siamsi':'siamsi'}[location.hash]||'main';
  var TAB_ICO={
    main:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',
    graph:'<path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 6-7"/>',
    siamsi:'<path d="M7 10h10v10a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1z"/><path d="M9.5 10L8.5 3M12 10V2M14.5 10l1-7"/>'
  };
  function tabsHtml(){
    return '<div class="tabs" id="tabs" role="tablist">'+[['main','ดวงของฉัน'],['graph','กราฟชีวิต'],['siamsi','เซียมซี']].map(function(t){
      var on=TAB===t[0];
      return '<button type="button" role="tab" aria-selected="'+on+'"'+(on?' class="on"':'')+' data-tab="'+t[0]+'">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+TAB_ICO[t[0]]+'</svg>'+t[1]+'</button>';
    }).join('')+'</div>';
  }
  function setTab(t){
    if(t===TAB)return;
    TAB=t;
    try{history.replaceState(null,'',t==='main'?location.pathname+location.search:'#'+t);}catch(e){}
    render();
    var tb=$('tabs'); if(tb&&tb.getBoundingClientRect().top<0) tb.scrollIntoView();
  }

  /* ================= กราฟชีวิต (มหาทักษา 64 ช่วงย่อย) ================= */
  var LIFE=null;   /* {G, age, now, sel, geo} */
  function lifeAt(G,age){for(var i=0;i<G.length;i++)if(age>=G[i].fromAge&&age<G[i].toAge)return G[i];return G[G.length-1];}
  function ageSpan(g){var a=Math.floor(g.fromAge),b=Math.floor(g.toAge-1e-6);return a===b?'อายุ '+a+' ปี':'อายุ '+a+'–'+b+' ปี';}
  function lvChip(lv){var x=LIFE_LV[lv];return '<span class="rel '+x[1]+'">'+x[0]+'</span>';}
  // รวมช่วงย่อยที่ติดกันและเข้าเงื่อนไขเป็นช่วงเดียว
  function lifeSpans(G,test){
    var out=[],cur=null;
    G.forEach(function(g){
      if(!test(g)){cur=null;return;}
      if(cur){cur.toAge=g.toAge;cur.to=g.to;cur.items.push(g);}
      else{cur={fromAge:g.fromAge,toAge:g.toAge,from:g.from,to:g.to,items:[g]};out.push(cur);}
    });
    return out;
  }
  function spanHtml(sp,age){
    var majors=[];
    sp.items.forEach(function(g){var k='ดาว'+g.major+'เสวยภูมิ'+g.majorRole;if(majors.indexOf(k)<0)majors.push(k);});
    var when=sp.fromAge<=age?'ตอนนี้อยู่ในช่วงนี้ ถึง '+shortDate(sp.to):shortDate(sp.from)+' – '+shortDate(sp.to);
    return '<div class="v" style="font-size:18px">'+when+'</div><p>'+ageSpan(sp)+' · '+esc(majors.join(' ต่อด้วย'))+'</p>';
  }
  function lifeHtml(P){
    var G=A.lifeGraph(P.birth,P.day), age=P.dasa.age%108, now=lifeAt(G,age), nx=G[G.indexOf(now)+1];
    LIFE={G:G,age:age,now:now,sel:now,geo:null};
    var trend=nx?'ช่วงย่อยถัดไปเริ่ม '+shortDate(nx.from)+' '+(nx.score>now.score+0.05?'กราฟขึ้น':nx.score<now.score-0.05?'กราฟลง':'กราฟทรงตัว')+' เป็นระดับ'+LIFE_LV[nx.level][0]:'';
    var up=lifeSpans(G,function(g){return g.level==='top';}).filter(function(s){return s.toAge>age;})[0];
    var dn=lifeSpans(G,function(g){return g.level==='low';}).filter(function(s){return s.toAge>age;})[0];
    var h='<div class="card"><div class="who">กราฟชีวิต · มหาทักษา</div>'+
      '<div class="title">ตอนนี้กราฟชีวิตอยู่ระดับ'+LIFE_LV[now.level][0]+'</div>'+
      (trend?'<div class="taksa">'+esc(trend)+'</div>':'')+
      '<div class="lg" id="lifeChart" role="img" aria-label="กราฟชีวิตตามมหาทักษา ตั้งแต่แรกเกิดถึงอายุ 108 ปี"></div>'+
      '<div class="lgl"><span><i style="background:#FFEFC2;border-color:#E2B84C"></i>ดาวเสวยภูมิเดช ศรี</span>'+
        '<span><i style="background:#FBE0E0;border-color:#E5A3A3"></i>ดาวเสวยภูมิกาลกิณี</span><span><i class="ln"></i>ตอนนี้</span></div>'+
      '<p class="howto" style="margin:6px 0 0">แตะหรือลากนิ้วบนกราฟเพื่อดูแต่ละช่วง ตัวย่อด้านบนคือดาวที่เสวยอายุ ตัวเลขด้านล่างคืออายุ</p>'+
      '<div class="lgi" id="lifeInfo"></div></div>';
    if(up||dn) h+='<div class="card"><div class="who">ช่วงสำคัญข้างหน้า</div>'+
      (up?'<div class="blk"><h3>ช่วงรุ่งถัดไป (ระดับดีมาก)</h3>'+spanHtml(up,age)+'</div>':'')+
      (dn?'<div class="blk"><h3>ช่วงที่ต้องระวังถัดไป</h3>'+spanHtml(dn,age)+'</div>':'')+'</div>';
    return h+yearsHtml(P,G)+lifeHowHtml(P);
  }
  function yearsHtml(P,G){
    var ty=+TODAY.slice(0,4), rows=[];
    for(var y=ty;y<ty+10;y++){var r=A.lifeYear(G,P.birth,y);if(r)rows.push(r);}
    if(!rows.length) return '';
    var hi=Math.max.apply(null,rows.map(function(r){return r.score;})), lo=Math.min.apply(null,rows.map(function(r){return r.score;}));
    function yearsOf(v){return rows.filter(function(r){return r.score===v;}).map(function(r){return r.year+543;}).join(', ');}
    var body=rows.map(function(r){
      var majors=[],subs=[];
      r.parts.forEach(function(g){
        var mk=g.major+' ('+g.majorRole+')'; if(majors.indexOf(mk)<0)majors.push(mk);
        subs.push(g.planet+' ('+g.role+')'+(g.from.slice(0,4)===String(r.year)?' '+MON[+g.from.slice(5,7)-1]:''));
      });
      return '<div class="yr'+(r.year===ty?' now':'')+'"><div class="y"><b>'+(r.year+543)+'</b><small>อายุ '+r.age+'</small></div>'+
        '<div><div class="bar"><i class="lv-'+r.level+'" style="width:'+Math.round((r.score-1)/4*100)+'%"></i></div>'+
        '<div class="yd">เสวย '+esc(majors.join(' → '))+' · แทรก '+esc(subs.join(' → '))+'</div></div>'+lvChip(r.level)+'</div>';
    }).join('');
    return '<div class="card"><div class="who">10 ปีข้างหน้า รายปี</div>'+
      '<div class="title" style="font-size:20px">ปีที่กราฟสูงสุด พ.ศ. '+yearsOf(hi)+'</div>'+
      (lo<hi?'<p class="howto">ปีที่กราฟต่ำสุดในช่วงนี้ พ.ศ. '+yearsOf(lo)+' · คะแนนแต่ละปีเฉลี่ยตามจำนวนวันที่ดาวแต่ละคู่อยู่ในปีนั้น ชื่อเดือนคือเดือนที่ดาวแทรกเปลี่ยน</p>':'')+
      '<div class="yrs">'+body+'</div></div>';
  }
  function lifeHowHtml(P){

  function drawLife(){

        // เวลา/จังหวัดที่เคยใส่ในเครื่องนี้แต่ยังไม่ขึ้นระบบ → ใช้ของเครื่อง แล้วส่งขึ้นให้
        var time=d.time||(same&&local.time)||'', place=d.place||(same&&local.place)||'';
        var syncUp=(!d.time&&time)||(!d.place&&place);
        var next={date:d.date,time:time,place:place,src:d.src==='registry'?'registry':'self'};
        var changed=JSON.stringify(next)!==JSON.stringify({date:local.date,time:local.time||'',place:local.place||'',src:local.src});
        BIRTH=next; lsSet(KEY,JSON.stringify(BIRTH));
        if(syncUp) pushServer();
        if(changed&&!FORM) render();
      }).catch(function(){});
  }

  $('dateLine').textContent='ดวงประจำ'+thaiDate(TODAY);
  render(); loadData(); loadMine();
})();
</script>
