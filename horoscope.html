<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ดวงของฉัน — ระบบงาน TIH</title>
<meta name="theme-color" content="#2E4A7D">
<link rel="icon" type="image/png" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* พาเลตจากรูปการ์ด taro: ฟ้าอ่อน · กรมท่า · ทอง · ขาว */
  :root{
    --bg:#C9E4FA;--bg2:#B5D9F7;--navy:#2E4A7D;--navy2:#23395F;--gold:#D9A93A;--card:#FFFFFF;
    --text:#1F2F4D;--muted:#4A5B78;--line:#DCE8F5;--chip:#EAF4FD;
    --good:#FFF4D6;--goodt:#7A5200;--bad:#FDECEC;--badt:#9B1C1C;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  [hidden]{display:none!important;}   /* .pay ตั้ง display:flex ไว้ ทำให้ hidden ไม่ซ่อน — แถบทองว่างโผล่ทุกวันที่ไม่ใช่วันรับทรัพย์ */
  body{font-family:'Sarabun',system-ui,sans-serif;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh;padding:20px 16px 40px;}
  .wrap{max-width:720px;margin:0 auto;}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .back{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--navy);text-decoration:none;font-weight:600;font-size:15px;padding:9px 14px;border-radius:11px;box-shadow:0 4px 10px rgba(46,74,125,.15);}
  .back svg{width:18px;height:18px;}
  h1{font-size:30px;font-weight:700;color:var(--navy);line-height:1.2;}
  .date{font-size:16px;color:var(--muted);font-weight:500;margin-top:2px;}
  .pay{display:flex;gap:12px;align-items:flex-start;background:var(--good);border:2px solid var(--gold);border-radius:16px;padding:14px 16px;margin:14px 0 4px;box-shadow:0 6px 16px rgba(217,169,58,.25);}
  .pay svg{flex-shrink:0;width:40px;height:40px;}
  .pay h2{font-size:19px;color:var(--goodt);margin-bottom:3px;}
  .pay p{font-size:16px;line-height:1.65;color:#4A3A12;}
  .note{background:#FFF7E0;border:1.5px solid #E9C766;color:#6A4B00;border-radius:12px;padding:11px 14px;font-size:14.5px;margin:12px 0;}
  .sech{font-size:21px;font-weight:700;color:var(--navy2);margin:24px 2px 10px;display:flex;align-items:center;gap:10px;}
  .sech::after{content:"";flex:1;height:2px;background:rgba(46,74,125,.18);border-radius:2px;}
  .card{background:var(--card);border-radius:18px;box-shadow:0 10px 24px rgba(46,74,125,.16);padding:20px 18px;margin-bottom:14px;}
  .who{font-size:14px;font-weight:600;color:var(--gold);letter-spacing:.2px;}
  .title{font-size:24px;font-weight:700;color:var(--navy);margin:2px 0 6px;line-height:1.35;}
  .stars{display:flex;gap:3px;margin-bottom:12px;}
  .stars svg{width:22px;height:22px;}
  .overall{font-size:17px;line-height:1.75;}
  .taksa{display:inline-block;background:var(--chip);color:var(--navy);font-size:14px;font-weight:600;border-radius:9px;padding:6px 11px;margin-bottom:12px;}
  .sec{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line);}
  .sec:first-of-type{border-top:0;}
  .ico{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--chip);display:flex;align-items:center;justify-content:center;}
  .ico svg{width:22px;height:22px;stroke:var(--navy);}
  .sec h3{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:2px;}
  .sec p{font-size:16px;line-height:1.65;color:var(--text);}
  .lucky{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .lucky .wide{grid-column:1/-1;}
  .lk{background:var(--chip);border-radius:12px;padding:12px 14px;}
  .lk span{display:block;font-size:13.5px;color:var(--muted);font-weight:600;}
  .lk b{font-size:18px;color:var(--navy);}
  .lk.avoid{background:var(--bad);}
  .lk.avoid b{color:var(--badt);}
  .lk .warn{display:block;font-style:normal;font-size:13px;color:var(--muted);margin-top:4px;line-height:1.4;}
  .howto{font-size:15px;color:var(--muted);line-height:1.6;margin:4px 0 8px;}
  .bhumi{padding:11px 12px;border-top:1px solid var(--line);}
  .bhumi b{font-size:16px;color:var(--navy);}
  .bhumi p{font-size:15px;line-height:1.6;color:var(--text);margin-top:2px;}
  .bhumi.on{background:var(--chip);border-radius:12px;border-top-color:transparent;}
  .bhumi.on + .bhumi{border-top-color:transparent;}
  .today{display:inline-block;background:var(--navy);color:#fff;font-size:12px;font-weight:600;border-radius:7px;padding:2px 8px;margin-left:6px;vertical-align:2px;}
  footer{text-align:center;font-size:13.5px;color:var(--muted);margin-top:18px;line-height:1.6;}
  .empty{text-align:center;font-size:16px;color:var(--muted);padding:26px 8px;}

  /* ข้อมูลเกิด */
  .pf{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;}
  .pf .txt{flex:1 1 260px;min-width:0;}
  .pf .big{font-size:18px;font-weight:700;color:var(--navy);line-height:1.5;}
  .pf .sub{font-size:15px;color:var(--muted);line-height:1.6;margin-top:2px;}
  .btn{font-family:inherit;font-size:15px;font-weight:700;border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:11px;padding:9px 15px;cursor:pointer;}
  .btn.pri{background:var(--navy);color:#fff;}
  .btn:disabled{opacity:.55;cursor:default;}
  .lnk{font:inherit;font-weight:700;color:var(--navy);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
  .form h2{font-size:20px;color:var(--navy);margin-bottom:4px;}
  .form .lbl{display:block;font-size:15px;font-weight:700;color:var(--navy);margin:14px 0 6px;}
  .form .lbl small{font-weight:600;color:var(--muted);font-size:13.5px;}
  .row3{display:grid;grid-template-columns:1fr 1.6fr 1.3fr;gap:8px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:320px;}
  select{font-family:inherit;font-size:16px;padding:10px 10px;border:1.5px solid #C4D6EA;border-radius:10px;background:#fff;color:var(--text);width:100%;}
  .locked{font-size:17px;font-weight:600;color:var(--text);background:var(--chip);border-radius:10px;padding:10px 12px;}
  .locked small{display:block;font-size:13px;font-weight:500;color:var(--muted);}
  .hint{background:var(--good);border-left:4px solid var(--gold);border-radius:10px;padding:10px 12px;font-size:14.5px;line-height:1.6;color:#4A3A12;margin-top:10px;}
  .acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px;}
  .msg{font-size:14.5px;font-weight:600;}
  .msg.ok{color:#1F6B3A;}.msg.err{color:var(--badt);}

  /* ป้ายความสัมพันธ์ ดี / ระวัง / กลาง */
  .rel{display:inline-block;font-size:14px;font-weight:700;border-radius:9px;padding:4px 11px;margin:2px 0 8px;}
  .rel.good{background:var(--good);color:var(--goodt);border:1.5px solid #E9C766;}
  .rel.bad{background:var(--bad);color:var(--badt);border:1.5px solid #F3C4C4;}
  .rel.mid{background:var(--chip);color:var(--navy);border:1.5px solid #C4D6EA;}
  .blk{padding:14px 0;border-top:1px solid var(--line);}
  .blk:first-child,.who + .blk{border-top:0;padding-top:0;}
  .who + .blk{margin-top:6px;}
  .blk:last-child{padding-bottom:0;}
  .blk h3{font-size:15px;font-weight:700;color:var(--muted);margin-bottom:2px;}
  .blk .v{font-size:21px;font-weight:700;color:var(--navy);line-height:1.4;}
  .blk .v small{font-size:15px;font-weight:600;color:var(--muted);}
  .blk p{font-size:16px;line-height:1.7;margin-top:4px;}
  .blk .fine{font-size:14px;color:var(--muted);line-height:1.55;margin-top:6px;}
  .num{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:var(--navy);color:#fff;font-size:22px;font-weight:700;margin-right:10px;vertical-align:middle;}

  /* มหาทักษา — ช่วงชีวิต 8 ช่วง */
  .dasa{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .dasa .r{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);font-size:15px;}
  .dasa .r:first-child{border-top:0;}
  .dasa .r .a{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;}
  .dasa .r .p{font-weight:700;color:var(--navy);}
  .dasa .r .p small{font-weight:500;color:var(--muted);}
  .dasa .r .s{font-size:13px;font-weight:700;border-radius:7px;padding:2px 8px;white-space:nowrap;}
  .dasa .r.past{color:#8A98AE;}
  .dasa .r.past .p{color:#8A98AE;}
  .dasa .r.now{background:var(--chip);}
  .dasa .r.now .s{background:var(--navy);color:#fff;}
  .dasa .r.next .s{background:var(--good);color:var(--goodt);}
  @media (max-width:420px){h1{font-size:26px;}.row3{grid-template-columns:1fr 1fr;}.row3 select:last-child{grid-column:1/-1;}.dasa .r{grid-template-columns:78px 1fr auto;font-size:14px;}}
</style>
</head>

  <div id="profile"></div>
  <div id="main"></div>

</div>

  var DASA_ROLE={

  var SIGN_TXT=[

  function opt(v,t,sel){return '<option value="'+v+'"'+(String(v)===String(sel)?' selected':'')+'>'+t+'</option>';}

      '<p class="howto">ดวงทั้งหน้าคำนวณจากข้อมูลนี้ ใส่ครั้งเดียว ครั้งต่อไปเปิดมาเห็นดวงของตัวเองเลย</p>';

    if(reg) h+='<div class="locked">'+(+p[3])+' '+MONTHS[+p[2]-1]+' '+(+p[1]+543)+'<small>จากทะเบียนพนักงาน ถ้าไม่ถูกต้องแจ้งฝ่ายบุคคล</small></div>';

      h+='<div class="row3"><select id="fD"><option value="">วันที่</option>'+ds+'</select><select id="fM"><option value="">เดือน</option>'+ms+'</select><select id="fY"><option value="">ปี พ.ศ.</option>'+ys+'</select></div>';

    for(var mm=0;mm<60;mm++) mins+=opt(('0'+mm).slice(-2),('0'+mm).slice(-2)+' นาที',tm?tm[2]:'');

      '<span class="lbl">จังหวัดที่เกิด <small>(ไม่บังคับ)</small></span>'+
      '<select id="fP" style="max-width:320px"><option value="">ไม่ทราบ</option>'+ps+'</select>'+
      '<div class="hint">ใส่ครั้งเดียว ระบบบันทึกไว้สำหรับการดูครั้งต่อไป ไม่ต้องใส่ใหม่ · เวลาเกิดใช้คำนวณลัคนา ราศีจันทร์ และวันเกิดแบบไทย (เกิดก่อน 6 โมงเช้า นับเป็นวันก่อนหน้า · วันพุธหลัง 6 โมงเย็น เป็นพุธกลางคืน) · จังหวัดที่เกิดทำให้ลัคนาตรงกับพิกัดที่เกิดจริง (ไม่เลือก = คิดที่กรุงเทพฯ) · ไม่ทราบเว้นว่างไว้ได้</div>';
    h+='<div class="acts"><button type="button" class="btn pri" id="fSave">บันทึก</button>'+

  function bindForm(){

  function saveForm(){
    var cur=BIRTH||{}, date=cur.src==='registry'?cur.date:'', msg=$('fMsg');
    if(!date){
      var d=$('fD').value,m=$('fM').value,y=$('fY').value;
      if(!d||!m||!y){msg.className='msg err';msg.textContent='เลือกวันที่ เดือน และปีเกิดให้ครบ';return;}
      var dt=new Date(Date.UTC(+y,+m-1,+d));
      if(dt.getUTCMonth()!==+m-1){msg.className='msg err';msg.textContent='วันที่นี้ไม่มีในเดือน'+MONTHS[+m-1];return;}
      date=y+'-'+('0'+m).slice(-2)+'-'+('0'+d).slice(-2);
    }
    var h=$('fH').value,n=$('fN').value,time='';
    if(h){time=h+':'+(n||'00');}
    BIRTH={date:date,time:time,place:$('fP').value,src:cur.src==='registry'?'registry':'self'};
    lsSet(KEY,JSON.stringify(BIRTH));
    FORM=false; render();

    var n=P.num, ty=+TODAY.slice(0,4);
    return '<div class="card"><div class="who">เลขศาสตร์</div>'+
      '<div class="blk"><h3>เลขชีวิต (จากวันเดือนปีเกิด)</h3><div class="v"><span class="num">'+n.life+'</span></div><p>'+esc(LIFE_TXT[n.life])+'</p></div>'+
      '<div class="blk"><h3>เลขปี '+(ty+543)+' ของคุณ</h3><div class="v"><span class="num">'+n.year+'</span></div><p>'+esc(PYEAR_TXT[n.year])+'</p></div></div>';
  }
  function bhumiCard(P){
    var role=P.taksa.todayRole;
    return '<div class="card"><div class="title" style="font-size:20px">ภูมิทั้ง 8 ในทักษา</div>'+
      '<p class="howto">เริ่มจากดาวประจำวันเกิดของคุณ (ดาว'+esc(P.day.planet)+') เป็น "บริวาร" แล้วนับวนตามวงทักษา ดาวของวันนี้ไปตกภูมิไหน เรื่องของภูมินั้นจะเด่นในวันนี้</p>'+
      TAKSA_FULL.map(function(t){var on=(t[0]===role);var r=A.rolesOf(P.day.planet)[t[0]];
        return '<div class="bhumi'+(on?' on':'')+'"><b>'+esc(t[0])+' <small style="font-weight:600;color:var(--muted)">ดาว'+esc(r)+'</small>'+(on?' <span class="today">วันนี้</span>':'')+'</b><p>'+esc(t[1])+'</p></div>';}).join('')+
      '</div>';
  }

  function render(){
    var P=(BIRTH&&BIRTH.date)?A.profile(BIRTH.date,BIRTH.time||'',TODAY,BIRTH.place||''):null;
    var fn=firstName(); $('head').textContent=fn?'ดวงของคุณ'+fn:'ดวงของคุณ';
    renderProfile(P);
    var m=$('main');
    if(!P||FORM){m.innerHTML='';return;}
    m.innerHTML='<div class="sech">ดวงวันนี้</div>'+taksaCard(P)+dayCard(P)+luckyCard(P)+
      '<div class="sech">ดวงชะตาของคุณ</div>'+dasaCard(P)+signCard(P)+chineseCard(P)+numCard(P)+bhumiCard(P);
    Array.prototype.forEach.call(document.querySelectorAll('[data-addtime]'),function(b){b.onclick=function(){FORM=true;render();window.scrollTo(0,0);};});
    logHit(P);
  }

  function loadData(){
    fetch('horoscope/today.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){
      DATA=j;
      $('dateLine').textContent='ดวงประจำ'+thaiDate(TODAY);
      var n=$('note');
      if(j.date!==TODAY){n.hidden=false;n.textContent='คำทำนายรายวันของวันนี้กำลังจะขึ้น (อัปเดตหลังเที่ยงคืน) ตอนนี้แสดงส่วนที่คำนวณจากวันเกิดของวันนี้ไปก่อน';}
      var pd=paydayOf(TODAY), pe=$('pay');
      if(pd){pe.hidden=false;pe.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="#B8871F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v4c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 10v4c0 1.7 3.1 3 7 3s7-1.3 7-3v-4"/><path d="M5 14v4c0 1.7 3.1 3 7 3s7-1.3 7-3v-4"/></svg><div><h2>'+esc(pd.title)+'</h2><p>'+esc(pd.text)+'</p></div>';}
      else pe.hidden=true;
      render();
    }).catch(function(){$('dateLine').textContent='ดวงประจำ'+thaiDate(TODAY);render();});
  }

  /* สถิติการเปิดหน้า (ดูได้ที่หน้าแรกผู้ดูแลระบบในพอร์ทัล tihkpn) — นับครั้งละการเปิด เครื่องเดิมภายใน 10 นาทีนับครั้งเดียว (ฝั่งฐานข้อมูล) */
  var SB_URL='https://ukyjtyyoksgpnptjhdhg.supabase.co', SB_KEY='sb_publishable_ZCURlrdrW3Iue8IymZOAbw_tfh8EHlh';
  var HIT_SENT=false;
  function logHit(P){
    if(HIT_SENT)return; HIT_SENT=true;
    var dev=lsGet('horo_dev'); if(!dev){dev=Math.random().toString(36).slice(2)+Date.now().toString(36);lsSet('horo_dev',dev);}
    fetch(SB_URL+'/rest/v1/rpc/horo_hit',{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+SB_KEY},
      body:JSON.stringify({p_emp:EMP,p_device:dev,p_dow:P?P.day.dow:null})}).catch(function(){});
  }

  /* วันเดือนปีเกิดจากทะเบียน + เวลาเกิดที่บันทึกไว้ในระบบ (เฉพาะของเจ้าของตั๋ว) */
  function loadMine(){
    if(!TK){if(!(BIRTH&&BIRTH.date))logHit(null);return;}
    fetch(AUTH+'/api/verifypin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'bday',token:TK})})
      .then(function(r){return r.json();}).then(function(d){
        if(!d||!d.ok||!d.date){if(!(BIRTH&&BIRTH.date))logHit(null);return;}
        var local=BIRTH||{}, same=local.date===d.date;
        // เวลา/จังหวัดที่เคยใส่ในเครื่องนี้แต่ยังไม่ขึ้นระบบ → ใช้ของเครื่อง แล้วส่งขึ้นให้
        var time=d.time||(same&&local.time)||'', place=d.place||(same&&local.place)||'';
        var syncUp=(!d.time&&time)||(!d.place&&place);
        var next={date:d.date,time:time,place:place,src:d.src==='registry'?'registry':'self'};
        var changed=JSON.stringify(next)!==JSON.stringify({date:local.date,time:local.time||'',place:local.place||'',src:local.src});
        BIRTH=next; lsSet(KEY,JSON.stringify(BIRTH));
        if(syncUp) pushServer();
        if(changed&&!FORM) render();
      }).catch(function(){});
  }

  $('dateLine').textContent='ดวงประจำ'+thaiDate(TODAY);
  render(); loadData(); loadMine();
})();
</script>
</body>
</html>
